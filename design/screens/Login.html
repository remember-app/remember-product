<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Вход</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&amp;family=Onest:wght@400;500;600;700&amp;display=swap">
<style>
body { margin: 0; font-family: 'Onest', ui-sans-serif, system-ui, sans-serif; background: #0B0B12; color: #F5F3EE; -webkit-font-smoothing: antialiased; overflow: hidden; }
html { overflow: hidden; }
a { color: #A7AEFF; }
button { font-family: inherit; }
input { font-family: inherit; }
</style>
</head>
<body>

<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0B0B12; position: relative; overflow: hidden;">

  <!-- Один прогресс на весь онбординг: видно, сколько шагов осталось. Apple и Google перепрыгивают со второго на четвёртый -->
  <div role="progressbar" aria-valuenow="1" aria-valuemin="1" aria-valuemax="5" aria-label="Шаг 1 из 5" style="position: absolute; left: 16px; right: 16px; top: 58px; display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px;"><span style="height: 4px; border-radius: 999px; background: #F5F3EE;"></span><span style="height: 4px; border-radius: 999px; background: #2C2C3A;"></span><span style="height: 4px; border-radius: 999px; background: #2C2C3A;"></span><span style="height: 4px; border-radius: 999px; background: #2C2C3A;"></span><span style="height: 4px; border-radius: 999px; background: #2C2C3A;"></span></div>

  <!-- Шаг 1 — стопка кадров с разных телефонов -->
  <div style="position: absolute; left: 0; top: 112px; right: 0; height: 176px; overflow: hidden;">
    <img src="../img/f05.jpg" alt="" style="position: absolute; left: 34px; top: 12px; width: 116px; height: 144px; object-fit: cover; border-radius: 16px; transform: rotate(-9deg); box-shadow: 0 18px 40px rgba(0,0,0,0.55);">
    <img src="../img/f09.jpg" alt="" style="position: absolute; right: 34px; top: 6px; width: 116px; height: 144px; object-fit: cover; border-radius: 16px; transform: rotate(8deg); box-shadow: 0 18px 40px rgba(0,0,0,0.55);">
    <img src="../img/f10.jpg" alt="" style="position: absolute; left: 50%; margin-left: -68px; top: 16px; width: 136px; height: 158px; object-fit: cover; border-radius: 18px; transform: rotate(-1.5deg); box-shadow: 0 22px 50px rgba(0,0,0,0.65);">
  </div>
  <div style="position: absolute; left: 0; top: 304px; right: 0; padding: 0 24px; display: flex; flex-direction: column; align-items: center; gap: 10px;">
    <h1 style="margin: 0; font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 42px; line-height: 44px; letter-spacing: -0.045em; color: #F5F3EE; text-align: center;">Remember</h1>
    <p style="margin: 0; font-size: 16px; line-height: 23px; font-weight: 400; color: #A4A1B2; text-align: center; text-wrap: pretty;">После события кадры расходятся по десяти телефонам. Здесь они сходятся обратно — и становятся роликом.</p>
  </div>

  <!-- Три двери, одного размера: ни одна не главнее -->
  <div style="position: absolute; left: 16px; right: 16px; bottom: 34px; display: flex; flex-direction: column; gap: 10px;">
    <button type="button" style="width: 100%; height: 56px; border: none; border-radius: 999px; background: #F5F3EE; color: #0B0B12; font-size: 16px; font-weight: 600; letter-spacing: -0.01em; cursor: pointer;">Продолжить с Apple</button>
    <button type="button" style="width: 100%; height: 56px; border: 1px solid #45424F; border-radius: 999px; background: transparent; color: #F5F3EE; font-size: 16px; font-weight: 600; letter-spacing: -0.01em; cursor: pointer;">Продолжить с Google</button>
    <button type="button" style="width: 100%; height: 56px; border: 1px solid #45424F; border-radius: 999px; background: transparent; color: #F5F3EE; font-size: 16px; font-weight: 600; letter-spacing: -0.01em; display: flex; align-items: center; justify-content: center; gap: 9px; cursor: pointer;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"></rect><path d="m3.5 7 8.5 6 8.5-6"></path></svg>
      Продолжить по почте
    </button>
  </div>

</div>
</body>
</html>
