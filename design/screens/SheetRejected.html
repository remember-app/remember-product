<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Компонент: что сняли</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&amp;family=Onest:wght@400;500;600;700&amp;display=swap">
<style>
body { margin: 0; font-family: 'Onest', ui-sans-serif, system-ui, sans-serif; background: #16161F; color: #F5F3EE; -webkit-font-smoothing: antialiased; overflow: hidden; }
html { overflow: hidden; }
button { font-family: inherit; }
</style>
</head>
<body>

<!-- Открывается с первого шага. Автоматика отчитывается, а не решает -->
<div style="width: 390px; height: 480px; box-sizing: border-box; background: #16161F; border-top: 1px solid #2C2C3A; border-radius: 28px 28px 0 0; padding: 12px 16px 30px; display: flex; flex-direction: column; gap: 18px;">

  <span style="width: 40px; height: 4px; border-radius: 999px; background: #3A3747; align-self: center;"></span>

  <div style="display: flex; flex-direction: column; gap: 8px;">
    <h2 style="margin: 0; font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 23px; line-height: 26px; letter-spacing: -0.03em; color: #F5F3EE;">Что сняли автоматически</h2>
    <p style="margin: 0; font-size: 14px; line-height: 20px; color: #A4A1B2;">68 кадров из 486. Ничего не потеряно — любой вернётся в ролик.</p>
  </div>

  <div style="display: flex; flex-direction: column;">

    <div style="display: flex; align-items: center; gap: 12px; padding: 10px 0;">
      <span style="width: 38px; height: 38px; border-radius: 12px; background: #22222E; color: #A4A1B2; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><path d="M12 8v5"></path></svg>
      </span>
      <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
        <span style="font-size: 15px; font-weight: 600; color: #F5F3EE;">Размыто</span>
        <span style="font-size: 12px; font-weight: 500; color: #A4A1B2; font-variant-numeric: tabular-nums;">34 кадра</span>
      </div>
      <button type="button" style="height: 40px; padding: 0 14px; border: 1px solid #45424F; border-radius: 999px; background: transparent; color: #F5F3EE; font-size: 13px; font-weight: 600; cursor: pointer; flex-shrink: 0;">Вернуть</button>
    </div>

    <div style="height: 1px; background: #2C2C3A;"></div>

    <div style="display: flex; align-items: center; gap: 12px; padding: 10px 0;">
      <span style="width: 38px; height: 38px; border-radius: 12px; background: #22222E; color: #A4A1B2; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"></rect><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"></path></svg>
      </span>
      <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
        <span style="font-size: 15px; font-weight: 600; color: #F5F3EE;">Дубли</span>
        <span style="font-size: 12px; font-weight: 500; color: #A4A1B2; font-variant-numeric: tabular-nums;">22 кадра — оставили лучший из серии</span>
      </div>
      <button type="button" style="height: 40px; padding: 0 14px; border: 1px solid #45424F; border-radius: 999px; background: transparent; color: #F5F3EE; font-size: 13px; font-weight: 600; cursor: pointer; flex-shrink: 0;">Вернуть</button>
    </div>

    <div style="height: 1px; background: #2C2C3A;"></div>

    <div style="display: flex; align-items: center; gap: 12px; padding: 10px 0;">
      <span style="width: 38px; height: 38px; border-radius: 12px; background: #22222E; color: #A4A1B2; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 3v2M12 19v2M5 12H3M21 12h-2"></path></svg>
      </span>
      <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
        <span style="font-size: 15px; font-weight: 600; color: #F5F3EE;">Темно</span>
        <span style="font-size: 12px; font-weight: 500; color: #A4A1B2; font-variant-numeric: tabular-nums;">12 кадров</span>
      </div>
      <button type="button" style="height: 40px; padding: 0 14px; border: 1px solid #45424F; border-radius: 999px; background: transparent; color: #F5F3EE; font-size: 13px; font-weight: 600; cursor: pointer; flex-shrink: 0;">Вернуть</button>
    </div>

  </div>

  <span style="flex-grow: 1;"></span>

  <div style="display: flex; flex-direction: column; gap: 4px;">
    <button type="button" style="width: 100%; height: 56px; border: none; border-radius: 999px; background: #4B5BFF; color: #FFFFFF; font-size: 16px; font-weight: 600; letter-spacing: -0.01em; cursor: pointer; box-shadow: 0 12px 32px rgba(75,91,255,0.38); font-variant-numeric: tabular-nums;">Вернуть все 68</button>
    <button type="button" style="width: 100%; height: 48px; border: none; border-radius: 999px; background: transparent; color: #A4A1B2; font-size: 15px; font-weight: 600; cursor: pointer;">Оставить как есть</button>
  </div>

</div>
</body>
</html>
