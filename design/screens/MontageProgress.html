<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Собираем ролик</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&amp;family=Onest:wght@400;500;600;700&amp;display=swap">
<style>
body { margin: 0; font-family: 'Onest', ui-sans-serif, system-ui, sans-serif; background: #0B0B12; color: #F5F3EE; -webkit-font-smoothing: antialiased; overflow: hidden; }
html { overflow: hidden; }
button { font-family: inherit; }
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0B0B12; position: relative; overflow: hidden;">

  <div style="position: absolute; left: 0; top: 0; right: 0; padding: 52px 16px 0;">
    <div style="display: flex; align-items: center; gap: 8px; height: 44px;">
      <button type="button" aria-label="Назад" style="width: 44px; height: 44px; margin-left: -10px; border: none; border-radius: 999px; background: transparent; color: #F5F3EE; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; flex-shrink: 0;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
      </button>
      <h1 style="margin: 0; flex-grow: 1; min-width: 0; font-family: 'Unbounded', sans-serif; font-weight: 600; font-size: 18px; line-height: 22px; letter-spacing: -0.03em; color: #F5F3EE; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Свадьба Лизы и Марка</h1>
    </div>
  </div>

  <div style="position: absolute; left: 0; top: 124px; right: 0; bottom: 0; padding: 0 16px; display: flex; flex-direction: column; gap: 24px; overflow: hidden;">

    <!-- Кадры, из которых он собирается: видно, что работа идёт над вашим материалом -->
    <div style="position: relative; height: 176px; border-radius: 22px; overflow: hidden; background: #16161F;">
      <div style="position: absolute; inset: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 2px;">
        <img src="../img/f03.jpg" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block;">
        <img src="../img/f10.jpg" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block;">
        <img src="../img/f06.jpg" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block;">
        <img src="../img/f11.jpg" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block;">
      </div>
      <div style="position: absolute; inset: 0; background: rgba(8,8,14,0.72);"></div>
      <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;">
        <span style="width: 34px; height: 34px; border-radius: 999px; border: 3px solid #2C2C3A; border-top-color: #E4FF4F;"></span>
        <span style="font-family: 'Unbounded', sans-serif; font-size: 20px; font-weight: 700; letter-spacing: -0.03em; color: #F5F3EE;">Собираем ролик</span>
        <span style="font-size: 13px; font-weight: 500; color: #A4A1B2; font-variant-numeric: tabular-nums;">Минута · горизонтальный · 214 кадров</span>
      </div>
    </div>

    <p style="margin: 0; font-size: 14px; line-height: 21px; font-weight: 400; color: #A4A1B2;">Приложение можно закрыть — мы пришлём уведомление всем участникам, когда ролик будет готов.</p>

    <!-- Пять шагов из doc-11, а не проценты, которые ничего не значат -->
    <div style="display: flex; flex-direction: column;">

      <div style="display: flex; align-items: center; gap: 12px; padding: 11px 0;">
        <span aria-hidden="true" style="width: 26px; height: 26px; border-radius: 999px; background: #E4FF4F; color: #14160A; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg>
        </span>
        <span style="flex-grow: 1; font-size: 15px; font-weight: 500; color: #A4A1B2;">Отсев брака</span>
        <span style="font-size: 12px; font-weight: 600; color: #A4A1B2;">готово</span>
      </div>

      <div style="display: flex; align-items: center; gap: 12px; padding: 11px 0;">
        <span aria-hidden="true" style="width: 26px; height: 26px; border-radius: 999px; background: #E4FF4F; color: #14160A; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg>
        </span>
        <span style="flex-grow: 1; font-size: 15px; font-weight: 500; color: #A4A1B2;">Разбираем, что на кадрах</span>
        <span style="font-size: 12px; font-weight: 600; color: #A4A1B2;">готово</span>
      </div>

      <div style="display: flex; align-items: center; gap: 12px; padding: 11px 0;">
        <span aria-hidden="true" style="width: 26px; height: 26px; border-radius: 999px; border: 2.5px solid #2C2C3A; border-top-color: #4B5BFF; box-sizing: border-box; flex-shrink: 0;"></span>
        <span style="flex-grow: 1; font-size: 15px; font-weight: 600; color: #F5F3EE;">Режиссёр строит историю</span>
        <span style="font-size: 12px; font-weight: 600; color: #A7AEFF;">идёт</span>
      </div>

      <div style="display: flex; align-items: center; gap: 12px; padding: 11px 0;">
        <span aria-hidden="true" style="width: 26px; height: 26px; border-radius: 999px; border: 1.5px solid #2C2C3A; box-sizing: border-box; flex-shrink: 0;"></span>
        <span style="flex-grow: 1; font-size: 15px; font-weight: 500; color: #6E6B7D;">Раскладываем в ритм трека</span>
      </div>

      <div style="display: flex; align-items: center; gap: 12px; padding: 11px 0;">
        <span aria-hidden="true" style="width: 26px; height: 26px; border-radius: 999px; border: 1.5px solid #2C2C3A; box-sizing: border-box; flex-shrink: 0;"></span>
        <span style="flex-grow: 1; font-size: 15px; font-weight: 500; color: #6E6B7D;">Склеиваем</span>
      </div>

    </div>

  </div>

  <div style="position: absolute; left: 16px; right: 16px; bottom: 30px;">
    <button type="button" style="width: 100%; height: 56px; border: 1px solid #45424F; border-radius: 999px; background: transparent; color: #F5F3EE; font-size: 16px; font-weight: 600; letter-spacing: -0.01em; cursor: pointer;">К воспоминанию</button>
  </div>

</div>
</body>
</html>
