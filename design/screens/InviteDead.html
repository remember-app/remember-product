<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Приглашение не действует</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&amp;family=Onest:wght@400;500;600;700&amp;display=swap">
<style>
body { margin: 0; font-family: 'Onest', ui-sans-serif, system-ui, sans-serif; background: #0B0B12; color: #F5F3EE; -webkit-font-smoothing: antialiased; overflow: hidden; }
html { overflow: hidden; }
button { font-family: inherit; }
</style>
</head>
<body>

<!-- Ссылку отозвали или заменили. Виноват не человек — это сказано вслух -->
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0B0B12; position: relative; overflow: hidden;">

  <div style="position: absolute; left: 0; top: 0; right: 0; bottom: 132px; padding: 0 36px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px;">

    <span aria-hidden="true" style="width: 96px; height: 96px; border-radius: 999px; background: #16161F; border: 1px solid #2C2C3A; color: #6E6B7D; display: flex; align-items: center; justify-content: center; box-sizing: border-box;">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 14.5 7 17a3.5 3.5 0 0 1-5-5l2.5-2.5"></path><path d="M14.5 9.5 17 7a3.5 3.5 0 0 1 5 5l-2.5 2.5"></path><path d="M3 3 21 21"></path></svg>
    </span>

    <div style="display: flex; flex-direction: column; align-items: center; gap: 12px;">
      <h1 style="margin: 0; font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 24px; line-height: 28px; letter-spacing: -0.035em; color: #F5F3EE; text-align: center;">Приглашение не действует</h1>
      <p style="margin: 0; font-size: 16px; line-height: 23px; font-weight: 400; color: #A4A1B2; text-align: center; text-wrap: pretty;">Эту ссылку отозвали или заменили новой. Попросите свежую у того, кто вас звал.</p>
    </div>

  </div>

  <div style="position: absolute; left: 16px; right: 16px; bottom: 30px;">
    <button type="button" style="width: 100%; height: 56px; border: none; border-radius: 999px; background: #4B5BFF; color: #FFFFFF; font-size: 16px; font-weight: 600; letter-spacing: -0.01em; cursor: pointer; box-shadow: 0 12px 32px rgba(75,91,255,0.38);">К моим воспоминаниям</button>
  </div>

</div>

</html>
