<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Компонент: сортировка</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&amp;family=Onest:wght@400;500;600;700&amp;display=swap">
<style>
body { margin: 0; font-family: 'Onest', ui-sans-serif, system-ui, sans-serif; background: #16161F; color: #F5F3EE; -webkit-font-smoothing: antialiased; overflow: hidden; }
html { overflow: hidden; }
a { color: inherit; text-decoration: none; }
button { font-family: inherit; }
</style>
</head>
<body>

<div style="width: 390px; height: 470px; box-sizing: border-box; background: #16161F; border-top: 1px solid #2C2C3A; border-radius: 28px 28px 0 0; padding: 12px 16px 30px; display: flex; flex-direction: column; gap: 20px; overflow: hidden;">
  <span style="width: 40px; height: 4px; border-radius: 999px; background: #3A3747; align-self: center;"></span>

  <!-- Сортировка решает, В КАКОМ ПОРЯДКЕ показать. Даты — не группа, а подпись, поэтому они отдельным тумблером -->
  <div style="display: flex; align-items: center;"><h2 style="margin: 0; flex-grow: 1; font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 23px; line-height: 26px; letter-spacing: -0.03em; color: #F5F3EE;">Сортировка</h2></div>

  <div style="display: flex; flex-direction: column; gap: 10px;">
    <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #A4A1B2;">Порядок</span>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 999px; background: #0B0B12; border: 1px solid #2C2C3A;"><button type="button" aria-pressed="true" style="height: 40px; border: none; border-radius: 999px; background: #F5F3EE; color: #0B0B12; font-size: 14px; font-weight: 600; cursor: pointer;">Сначала новые</button><button type="button" aria-pressed="false" style="height: 40px; border: none; border-radius: 999px; background: transparent; color: #A4A1B2; font-size: 14px; font-weight: 600; cursor: pointer;">Сначала старые</button></div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px;">
    <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #A4A1B2;">Собрать в группы</span>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 999px; background: #0B0B12; border: 1px solid #2C2C3A;"><button type="button" aria-pressed="true" style="height: 40px; border: none; border-radius: 999px; background: #F5F3EE; color: #0B0B12; font-size: 14px; font-weight: 600; cursor: pointer;">Не собирать</button><button type="button" aria-pressed="false" style="height: 40px; border: none; border-radius: 999px; background: transparent; color: #A4A1B2; font-size: 14px; font-weight: 600; cursor: pointer;">По людям</button><button type="button" aria-pressed="false" style="height: 40px; border: none; border-radius: 999px; background: transparent; color: #A4A1B2; font-size: 14px; font-weight: 600; cursor: pointer;">По типу</button></div>
  </div>
  <div style="display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 20px; background: #0B0B12; border: 1px solid #2C2C3A;">
    <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 4px;">
      <span id="dates-l" style="font-size: 15px; font-weight: 600; color: #F5F3EE;">Даты между днями</span>
      <span style="font-size: 12px; line-height: 17px; font-weight: 400; color: #A4A1B2; text-wrap: pretty;">Выключено — дата видна только на полосе у края, пока листаете.</span>
    </div>
    <button type="button" role="switch" aria-checked="true" aria-labelledby="dates-l" style="width: 52px; height: 32px; padding: 3px; border: none; border-radius: 999px; background: #4B5BFF; display: flex; justify-content: flex-end; align-items: center; cursor: pointer; flex-shrink: 0;"><span style="width: 26px; height: 26px; border-radius: 999px; background: #FFFFFF; display: block;"></span></button>
  </div>
  <span style="flex-grow: 1;"></span>
  <button type="button" style="width: 100%; height: 56px; border: none; border-radius: 999px; background: #4B5BFF; color: #FFFFFF; font-size: 16px; font-weight: 600; letter-spacing: -0.01em; cursor: pointer; box-shadow: 0 12px 32px rgba(75,91,255,0.38); font-variant-numeric: tabular-nums;">Готово</button>

</div>
</body>
</html>
