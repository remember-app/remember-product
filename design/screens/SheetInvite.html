<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Компонент: приглашение</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&amp;family=Onest:wght@400;500;600;700&amp;display=swap">
<style>
body { margin: 0; font-family: 'Onest', ui-sans-serif, system-ui, sans-serif; background: #16161F; color: #F5F3EE; -webkit-font-smoothing: antialiased; overflow: hidden; }
html { overflow: hidden; }
button { font-family: inherit; }
input { font-family: inherit; }
</style>
</head>
<body>
<!-- Поднимается с лица «Люди». Обе дороги внутрь на одном листе -->
<div style="width: 390px; height: 640px; box-sizing: border-box; background: #16161F; border-top: 1px solid #2C2C3A; border-radius: 28px 28px 0 0; padding: 12px 16px 30px; display: flex; flex-direction: column; gap: 18px;">

  <span style="width: 40px; height: 4px; border-radius: 999px; background: #3A3747; align-self: center;"></span>

  <h2 style="margin: 0; font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 23px; line-height: 26px; letter-spacing: -0.03em; color: #F5F3EE;">Позвать человека</h2>

  <label for="invite-nick" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%);">Ник</label>
  <div style="height: 54px; border-radius: 18px; background: #0B0B12; border: 1px solid #2C2C3A; display: flex; align-items: center; gap: 4px; padding: 0 16px; box-sizing: border-box;">
    <span style="font-size: 16px; font-weight: 500; color: #6E6B7D;">@</span>
    <input id="invite-nick" type="text" value="" placeholder="ник" autocomplete="off" autocapitalize="none" style="flex-grow: 1; min-width: 0; background: transparent; border: none; outline: none; color: #F5F3EE; font-size: 16px; font-weight: 500; padding: 0;">
  </div>

  <!-- Уровень доступа решается один раз и для обеих дорог -->
  <div style="display: flex; align-items: center; gap: 12px;">
    <span style="flex-grow: 1; font-size: 15px; font-weight: 500; color: #F5F3EE;">Сможет добавлять фото</span>
    <button type="button" role="switch" aria-checked="true" aria-label="Сможет добавлять фото" style="width: 52px; height: 32px; padding: 3px; border: none; border-radius: 999px; background: #4B5BFF; display: flex; justify-content: flex-end; align-items: center; cursor: pointer; flex-shrink: 0;">
      <span style="width: 26px; height: 26px; border-radius: 999px; background: #FFFFFF; display: block;"></span>
    </button>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px;">
    <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #A4A1B2;">Из контактов</span>
    <div style="display: flex; flex-wrap: wrap; gap: 8px;">
      <button type="button" style="height: 44px; padding: 0 16px 0 6px; border: 1px solid #2C2C3A; border-radius: 999px; background: transparent; color: #F5F3EE; font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 9px; cursor: pointer;">
        <span aria-hidden="true" style="width: 32px; height: 32px; border-radius: 999px; background: #22222E; color: #F5F3EE; font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">МБ</span>
        Марина
      </button>
      <button type="button" style="height: 44px; padding: 0 16px 0 6px; border: 1px solid #2C2C3A; border-radius: 999px; background: transparent; color: #F5F3EE; font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 9px; cursor: pointer;">
        <span aria-hidden="true" style="width: 32px; height: 32px; border-radius: 999px; background: #22222E; color: #F5F3EE; font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">КК</span>
        Костя
      </button>
      <button type="button" style="height: 44px; padding: 0 16px 0 6px; border: 1px solid #2C2C3A; border-radius: 999px; background: transparent; color: #F5F3EE; font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 9px; cursor: pointer;">
        <span aria-hidden="true" style="width: 32px; height: 32px; border-radius: 999px; background: #22222E; color: #F5F3EE; font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">ПЛ</span>
        Паша
      </button>
      <button type="button" style="height: 44px; padding: 0 16px 0 6px; border: 1px solid #2C2C3A; border-radius: 999px; background: transparent; color: #F5F3EE; font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 9px; cursor: pointer;">
        <span aria-hidden="true" style="width: 32px; height: 32px; border-radius: 999px; background: #22222E; color: #F5F3EE; font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">ИР</span>
        Ира
      </button>
    </div>
  </div>

  <!-- Вторая дорога: для тех, чьего ника вы не знаете -->
  <div style="display: flex; align-items: center; gap: 12px; padding-top: 16px; border-top: 1px solid #2C2C3A;">
    <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px;">
      <span style="font-size: 14px; font-weight: 600; color: #F5F3EE;">Ссылка-приглашение</span>
      <span style="font-size: 12px; line-height: 17px; font-weight: 400; color: #A4A1B2;">Кто перейдёт по ней, войдёт как «Добавление».</span>
    </div>
    <button type="button" style="height: 44px; padding: 0 16px; border: 1px solid #45424F; border-radius: 999px; background: transparent; color: #F5F3EE; font-size: 13px; font-weight: 600; cursor: pointer; flex-shrink: 0;">Получить</button>
  </div>

  <span style="flex-grow: 1;"></span>

  <button type="button" style="width: 100%; height: 56px; border: none; border-radius: 999px; background: #4B5BFF; color: #FFFFFF; font-size: 16px; font-weight: 600; letter-spacing: -0.01em; cursor: pointer; box-shadow: 0 12px 32px rgba(75,91,255,0.38);">Позвать</button>

</div>
</body>
</html>
