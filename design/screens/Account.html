<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Аккаунт</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&amp;family=Onest:wght@400;500;600;700&amp;display=swap">
<style>
body { margin: 0; font-family: 'Onest', ui-sans-serif, system-ui, sans-serif; background: #0B0B12; color: #F5F3EE; -webkit-font-smoothing: antialiased; overflow: hidden; }
html { overflow: hidden; }
a { color: inherit; text-decoration: none; }
button { font-family: inherit; }
</style>
</head>
<body>

<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0B0B12; position: relative; overflow: hidden;">

  <div style="position: absolute; left: 0; top: 0; right: 0; padding: 52px 16px 0;">
    <div style="display: flex; align-items: center; gap: 8px; height: 44px;">
      <button type="button" aria-label="Назад" style="width: 44px; height: 44px; margin-left: -10px; border: none; border-radius: 999px; background: transparent; color: #F5F3EE; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; flex-shrink: 0;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
      </button>
      <h1 style="margin: 0; flex-grow: 1; font-family: 'Unbounded', sans-serif; font-weight: 600; font-size: 18px; line-height: 22px; letter-spacing: -0.03em; color: #F5F3EE;">Аккаунт</h1>
    </div>
  </div>

  <div style="position: absolute; left: 16px; right: 16px; top: 132px; display: flex; flex-direction: column; gap: 26px;">

    <!-- Кто вы — своя карточка, отодвинутая от шапки. Карандаш правит имя, ник и почту -->
    <div style="display: flex; align-items: center; gap: 14px; padding: 16px; border-radius: 26px; background: #16161F; border: 1px solid #2C2C3A;">
      <span style="width: 64px; height: 64px; border-radius: 999px; background: #22222E; color: #F5F3EE; font-family: 'Unbounded', sans-serif; font-size: 19px; font-weight: 600; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">ЛМ</span>
      <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px;">
        <h2 style="margin: 0; font-family: 'Unbounded', sans-serif; font-weight: 600; font-size: 19px; line-height: 22px; letter-spacing: -0.03em; color: #F5F3EE; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Лиза Морозова</h2>
        <span style="font-size: 13px; font-weight: 600; color: #F5F3EE;">@liza</span>
        <span style="font-size: 12px; font-weight: 400; color: #A4A1B2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">liza@example.com</span>
      </div>
      <button type="button" aria-label="Изменить имя, ник и почту" style="width: 44px; height: 44px; border: none; border-radius: 999px; background: #22222E; color: #F5F3EE; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; flex-shrink: 0;"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"></path></svg></button>
    </div>

    <!-- Контакты — отдельный раздел со своим заголовком: это адресная книга, а не строка настроек -->
    <div style="display: flex; flex-direction: column; gap: 10px;">
      <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #A4A1B2;">Контакты</span>
      <a href="Contacts.html" style="display: flex; flex-direction: column; gap: 14px; padding: 16px; border-radius: 26px; background: #16161F; border: 1px solid #2C2C3A;">
        <div style="display: flex; align-items: center; gap: 12px;">
          <span style="display: flex; align-items: center; flex-shrink: 0;"><span style="width: 36px; height: 36px;  border-radius: 999px; background: #2F5E63; box-shadow: 0 0 0 2px #16161F; color: #F5F3EE; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center;">МК</span><span style="width: 36px; height: 36px; margin-left: -12px; border-radius: 999px; background: #7A4B3A; box-shadow: 0 0 0 2px #16161F; color: #F5F3EE; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center;">АП</span><span style="width: 36px; height: 36px; margin-left: -12px; border-radius: 999px; background: #3E5A2E; box-shadow: 0 0 0 2px #16161F; color: #F5F3EE; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center;">ВГ</span><span style="width: 36px; height: 36px; margin-left: -12px; border-radius: 999px; background: #5A3E5E; box-shadow: 0 0 0 2px #16161F; color: #F5F3EE; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center;">ДС</span></span>
          <span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
            <span style="font-size: 17px; font-weight: 600; color: #F5F3EE;">8 человек</span>
            <span style="font-size: 12px; font-weight: 500; color: #A4A1B2;">Зовите выбором, не по нику</span>
          </span>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6E6B7D" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0;"><path d="m9 18 6-6-6-6"></path></svg>
        </div>
      </a>
    </div>

    <div style="display: flex; flex-direction: column; gap: 18px;">
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #A4A1B2;">Тема</span>
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 999px; background: #16161F; border: 1px solid #2C2C3A;"><button type="button" aria-pressed="true" style="height: 40px; border: none; border-radius: 999px; background: #F5F3EE; color: #0B0B12; font-size: 13px; font-weight: 600; cursor: pointer;">Как в системе</button><button type="button" aria-pressed="false" style="height: 40px; border: none; border-radius: 999px; background: transparent; color: #A4A1B2; font-size: 13px; font-weight: 600; cursor: pointer;">Тёмная</button><button type="button" aria-pressed="false" style="height: 40px; border: none; border-radius: 999px; background: transparent; color: #A4A1B2; font-size: 13px; font-weight: 600; cursor: pointer;">Светлая</button></div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #A4A1B2;">Язык</span>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 999px; background: #16161F; border: 1px solid #2C2C3A;"><button type="button" aria-pressed="true" style="height: 40px; border: none; border-radius: 999px; background: #F5F3EE; color: #0B0B12; font-size: 14px; font-weight: 600; cursor: pointer;">Русский</button><button type="button" aria-pressed="false" style="height: 40px; border: none; border-radius: 999px; background: transparent; color: #A4A1B2; font-size: 14px; font-weight: 600; cursor: pointer;">English</button></div>
      </div>
    </div>

    <!-- Показ дат — свойство всех воспоминаний сразу, поэтому настройка общая, а не в сортировке каждой ленты -->
    <div style="display: flex; flex-direction: column; gap: 10px;">
      <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #A4A1B2;">Галерея</span>
      <div style="display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 26px; background: #16161F; border: 1px solid #2C2C3A;">
        <span id="dates-l" style="flex-grow: 1; min-width: 0; font-size: 16px; font-weight: 600; color: #F5F3EE;">Даты между днями</span>
        <button type="button" role="switch" aria-checked="true" aria-labelledby="dates-l" style="width: 52px; height: 32px; padding: 3px; border: none; border-radius: 999px; background: #4B5BFF; display: flex; justify-content: flex-end; align-items: center; cursor: pointer; flex-shrink: 0;"><span style="width: 26px; height: 26px; border-radius: 999px; background: #FFFFFF; display: block;"></span></button>
      </div>
    </div>

  </div>

  <!-- Уход стоит отдельно и внизу: не действие экрана, а выход из него -->
  <div style="position: absolute; left: 16px; right: 16px; bottom: 30px;">
    <button type="button" style="width: 100%; height: 60px; border: none; border-radius: 999px; background: #CE3028; color: #FFFFFF; font-size: 17px; font-weight: 600; letter-spacing: -0.01em; display: flex; align-items: center; justify-content: center; cursor: pointer;">Выйти из аккаунта</button>
  </div>

</div>
</body>
</html>
