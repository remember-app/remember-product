<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Аккаунт</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&amp;family=Onest:wght@400;500;600;700&amp;display=swap">
<style>
body { margin: 0; font-family: 'Onest', ui-sans-serif, system-ui, sans-serif; background: #0B0B12; color: #F5F3EE; -webkit-font-smoothing: antialiased; overflow: hidden; }
html { overflow: hidden; }
a { color: inherit; text-decoration: none; }
button { font-family: inherit; }
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0B0B12; position: relative; overflow: hidden;">

  <div style="position: absolute; left: 0; top: 0; right: 0; padding: 52px 16px 0;">
    <div style="display: flex; align-items: center; gap: 8px; height: 44px;">
      <button type="button" aria-label="Назад" style="width: 44px; height: 44px; margin-left: -10px; border: none; border-radius: 999px; background: transparent; color: #F5F3EE; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; flex-shrink: 0;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
      </button>
      <h1 style="margin: 0; flex-grow: 1; font-family: 'Unbounded', sans-serif; font-weight: 600; font-size: 18px; line-height: 22px; letter-spacing: -0.03em; color: #F5F3EE;">Аккаунт</h1>
    </div>
  </div>

  <div style="position: absolute; left: 0; top: 116px; right: 0; bottom: 0; padding: 0 16px; display: flex; flex-direction: column; gap: 24px; overflow: hidden;">

    <!-- Кто вы: то же кольцо организатора, что в списке участников -->
    <div style="display: flex; align-items: center; gap: 14px; padding-bottom: 22px; border-bottom: 1px solid #2C2C3A;">
      <span style="width: 68px; height: 68px; border-radius: 999px; background: #22222E; color: #F5F3EE; font-family: 'Unbounded', sans-serif; font-size: 20px; font-weight: 600; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">ЛМ</span>
      <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px;">
        <h2 style="margin: 0; font-family: 'Unbounded', sans-serif; font-weight: 600; font-size: 21px; line-height: 24px; letter-spacing: -0.03em; color: #F5F3EE; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Лиза Морозова</h2>
        <span style="font-size: 14px; font-weight: 500; color: #F5F3EE;">@liza</span>
        <span style="font-size: 13px; font-weight: 400; color: #A4A1B2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">liza@example.com</span>
      </div>
    </div>

    <!-- Контакты — раздел аккаунта, а не вторая иконка в шапке главного -->
    <a href="Contacts.html" style="display: flex; align-items: center; gap: 14px; height: 72px; padding: 0 16px; border-radius: 20px; background: #16161F; border: 1px solid #2C2C3A;">
      <span style="display: flex; align-items: center; flex-shrink: 0;">
        <span style="width: 34px; height: 34px; border-radius: 999px; background: #22222E; box-shadow: 0 0 0 2px #16161F; color: #F5F3EE; font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center;">МК</span>
        <span style="width: 34px; height: 34px; margin-left: -12px; border-radius: 999px; background: #262030; box-shadow: 0 0 0 2px #16161F; color: #F5F3EE; font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center;">АП</span>
        <span style="width: 34px; height: 34px; margin-left: -12px; border-radius: 999px; background: #2A2436; box-shadow: 0 0 0 2px #16161F; color: #F5F3EE; font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center;">ВГ</span>
      </span>
      <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px;">
        <span style="font-size: 16px; font-weight: 600; color: #F5F3EE;">Контакты</span>
        <span style="font-size: 12px; font-weight: 500; color: #A4A1B2; font-variant-numeric: tabular-nums;">8 человек — зовите выбором, не вспоминая ник</span>
      </div>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#A4A1B2" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0;"><path d="m9 18 6-6-6-6"></path></svg>
    </a>

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #A4A1B2;">Тема</span>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 999px; background: #16161F; border: 1px solid #2C2C3A;">
        <button type="button" aria-pressed="true" style="height: 40px; border: none; border-radius: 999px; background: #F5F3EE; color: #0B0B12; font-size: 13px; font-weight: 600; cursor: pointer;">Как в телефоне</button>
        <button type="button" aria-pressed="false" style="height: 40px; border: none; border-radius: 999px; background: transparent; color: #A4A1B2; font-size: 13px; font-weight: 600; cursor: pointer;">Тёмная</button>
        <button type="button" aria-pressed="false" style="height: 40px; border: none; border-radius: 999px; background: transparent; color: #A4A1B2; font-size: 13px; font-weight: 600; cursor: pointer;">Светлая</button>
      </div>
      <span style="font-size: 12px; font-weight: 400; color: #A4A1B2;">Меняется сразу — этот экран и есть образец.</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #A4A1B2;">Язык</span>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 999px; background: #16161F; border: 1px solid #2C2C3A;">
        <button type="button" aria-pressed="true" style="height: 40px; border: none; border-radius: 999px; background: #F5F3EE; color: #0B0B12; font-size: 14px; font-weight: 600; cursor: pointer;">Русский</button>
        <button type="button" aria-pressed="false" style="height: 40px; border: none; border-radius: 999px; background: transparent; color: #A4A1B2; font-size: 14px; font-weight: 600; cursor: pointer;">English</button>
      </div>
      <span style="font-size: 12px; font-weight: 400; color: #A4A1B2;">На нём же приходят письма и уведомления.</span>
    </div>

    <span style="flex-grow: 1;"></span>

    <!-- Уход стоит отдельно и внизу: не действие экрана, а выход из него -->
    <div style="padding-top: 22px; border-top: 1px solid #2C2C3A; padding-bottom: 30px;">
      <button type="button" style="width: 100%; height: 60px; border: none; border-radius: 999px; background: #CE3028; color: #FFFFFF; font-size: 17px; font-weight: 600; letter-spacing: -0.01em; display: flex; align-items: center; justify-content: center; cursor: pointer;">Выйти из аккаунта</button>
    </div>

  </div>

</div>
</body>
</html>
