<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Компонент: что сделать с кадром</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&amp;family=Onest:wght@400;500;600;700&amp;display=swap">
<style>
body { margin: 0; font-family: 'Onest', ui-sans-serif, system-ui, sans-serif; background: #16161F; color: #F5F3EE; -webkit-font-smoothing: antialiased; overflow: hidden; }
html { overflow: hidden; }
button { font-family: inherit; }
</style>
</head>
<body>
<!-- Поднимается с «⋯» в окне просмотра -->
<div style="width: 390px; height: 400px; box-sizing: border-box; background: #16161F; border-top: 1px solid #2C2C3A; border-radius: 28px 28px 0 0; padding: 12px 16px 30px; display: flex; flex-direction: column; gap: 16px;">

  <span style="width: 40px; height: 4px; border-radius: 999px; background: #3A3747; align-self: center;"></span>

  <div style="display: flex; align-items: center; gap: 12px;">
    <img src="../img/f10.jpg" alt="" style="width: 52px; height: 52px; object-fit: cover; border-radius: 12px; display: block; flex-shrink: 0;">
    <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px;">
      <span style="font-size: 15px; font-weight: 600; color: #F5F3EE;">Фото Марка Ковалёва</span>
      <span style="font-size: 12px; font-weight: 500; color: #A4A1B2; font-variant-numeric: tabular-nums;">13 сентября, 21:47 · 4,2 МБ</span>
    </div>
  </div>

  <div style="display: flex; flex-direction: column;">

    <button type="button" style="height: 56px; border: none; border-radius: 16px; background: transparent; color: #F5F3EE; font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 14px; padding: 0 4px; cursor: pointer; text-align: left;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><path d="m7 10 5 5 5-5"></path><path d="M12 15V3"></path></svg>
      Сохранить в галерею телефона
    </button>

    <div style="height: 1px; background: #2C2C3A;"></div>

    <button type="button" style="height: 56px; border: none; border-radius: 16px; background: transparent; color: #F5F3EE; font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 14px; padding: 0 4px; cursor: pointer; text-align: left;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0;"><path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7"></path><path d="M12 16V3"></path><path d="m7 8 5-5 5 5"></path></svg>
      Поделиться
    </button>

    <div style="height: 1px; background: #2C2C3A;"></div>

    <!-- Единственное необратимое здесь — и единственное красное -->
    <button type="button" style="height: 56px; border: none; border-radius: 16px; background: transparent; color: #FF8D8D; font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 14px; padding: 0 4px; cursor: pointer; text-align: left;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0;"><path d="M4 7h16"></path><path d="M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path><path d="M6 7v12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V7"></path></svg>
      Удалить из воспоминания
    </button>

  </div>

  <span style="flex-grow: 1;"></span>

  <button type="button" style="width: 100%; height: 52px; border: 1px solid #45424F; border-radius: 999px; background: transparent; color: #F5F3EE; font-size: 15px; font-weight: 600; cursor: pointer;">Закрыть</button>

</div>
</body>
</html>
