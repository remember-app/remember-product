<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Ролик — о чём он</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&amp;family=Onest:wght@400;500;600;700&amp;display=swap">
<style>
body { margin: 0; font-family: 'Onest', ui-sans-serif, system-ui, sans-serif; background: #0B0B12; color: #F5F3EE; -webkit-font-smoothing: antialiased; overflow: hidden; }
html { overflow: hidden; }
button { font-family: inherit; }
textarea { font-family: inherit; }
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0B0B12; position: relative; overflow: hidden;">

  <div style="position: absolute; left: 0; top: 0; right: 0; padding: 52px 16px 0;">
    <div style="display: flex; align-items: center; height: 44px;">
      <div style="width: 74px; display: flex;">
        <button type="button" aria-label="Назад" style="width: 44px; height: 44px; margin-left: -10px; border: none; border-radius: 999px; background: transparent; color: #F5F3EE; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
        </button>
      </div>
      <span style="flex-grow: 1; text-align: center; font-size: 13px; font-weight: 600; color: #A4A1B2; font-variant-numeric: tabular-nums;">Шаг 2 из 4</span>
      <div style="width: 74px; display: flex; justify-content: flex-end;">
        <button type="button" style="height: 44px; padding: 0 10px; margin-right: -10px; border: none; background: transparent; color: #A4A1B2; font-size: 14px; font-weight: 600; cursor: pointer;">Отмена</button>
      </div>
    </div>

    <div style="margin-top: 12px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px;">
      <span style="height: 3px; border-radius: 999px; background: #4B5BFF;"></span>
      <span style="height: 3px; border-radius: 999px; background: #4B5BFF;"></span>
      <span style="height: 3px; border-radius: 999px; background: #2C2C3A;"></span>
      <span style="height: 3px; border-radius: 999px; background: #2C2C3A;"></span>
    </div>

    <h1 style="margin: 18px 0 0; font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 26px; line-height: 29px; letter-spacing: -0.035em; color: #F5F3EE;">О чём этот ролик</h1>
    <p style="margin: 10px 0 0; font-size: 13px; line-height: 19px; font-weight: 500; color: #A4A1B2;">Можно пропустить — тогда режиссёр решит сам.</p>
  </div>

  <div style="position: absolute; left: 0; top: 206px; right: 0; bottom: 0; padding: 0 16px; display: flex; flex-direction: column; gap: 10px; overflow: hidden;">

    <label for="story" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%);">История ролика</label>
    <textarea id="story" rows="8" placeholder="Начни со сборов утром, потом церемония, а финал — танцы." style="height: 240px; box-sizing: border-box; border-radius: 20px; background: #16161F; border: 1px solid #4B5BFF; outline: none; color: #F5F3EE; font-size: 16px; font-weight: 400; line-height: 24px; padding: 16px 18px; resize: none;">Свадьба Лизы и Марка. Начни со сборов утром, дальше церемония в саду, а финал — танцы до трёх ночи. Побольше бабушки: она приехала впервые за пять лет.</textarea>

    <div style="display: flex; align-items: center; gap: 12px; padding: 0 4px;">
      <span style="flex-grow: 1; font-size: 12px; font-weight: 500; color: #6E6B7D;">Чем точнее, тем меньше сюрпризов</span>
      <span style="font-size: 12px; font-weight: 600; color: #A4A1B2; font-variant-numeric: tabular-nums;">186 / 600</span>
    </div>

    <!-- Затравки: не за человека, а вместо чистого листа -->
    <div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 10px;">
      <button type="button" style="height: 44px; padding: 0 16px; border: 1px solid #2C2C3A; border-radius: 999px; background: transparent; color: #F5F3EE; font-size: 14px; font-weight: 500; cursor: pointer;">Начни с…</button>
      <button type="button" style="height: 44px; padding: 0 16px; border: 1px solid #2C2C3A; border-radius: 999px; background: transparent; color: #F5F3EE; font-size: 14px; font-weight: 500; cursor: pointer;">Финал —…</button>
      <button type="button" style="height: 44px; padding: 0 16px; border: 1px solid #2C2C3A; border-radius: 999px; background: transparent; color: #F5F3EE; font-size: 14px; font-weight: 500; cursor: pointer;">Побольше…</button>
      <button type="button" style="height: 44px; padding: 0 16px; border: 1px solid #2C2C3A; border-radius: 999px; background: transparent; color: #F5F3EE; font-size: 14px; font-weight: 500; cursor: pointer;">Без…</button>
    </div>

  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 132px; background: linear-gradient(to top, #0B0B12 58%, rgba(11,11,18,0) 100%); pointer-events: none;"></div>
  <div style="position: absolute; left: 16px; right: 16px; bottom: 30px;">
    <button type="button" style="width: 100%; height: 56px; border: none; border-radius: 999px; background: #4B5BFF; color: #FFFFFF; font-size: 16px; font-weight: 600; letter-spacing: -0.01em; display: flex; align-items: center; justify-content: center; gap: 9px; cursor: pointer; box-shadow: 0 12px 32px rgba(75,91,255,0.38);">
      Дальше
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
    </button>
  </div>

</div>
</body>
</html>
