<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Пусто — ролики</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&amp;family=Onest:wght@400;500;600;700&amp;display=swap">
<style>
body { margin: 0; font-family: 'Onest', ui-sans-serif, system-ui, sans-serif; background: #0B0B12; color: #F5F3EE; -webkit-font-smoothing: antialiased; overflow: hidden; }
html { overflow: hidden; }
a { color: inherit; text-decoration: none; }
button { font-family: inherit; }
</style>
</head>
<body>

<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0B0B12; position: relative; overflow: hidden;">

  <div style="position: absolute; left: 0; right: 0; top: 116px;">

    <!-- Ролики — отдельный блок над галереей: то, ради чего всё затевалось, стоит первым -->
    <section aria-label="Ролики" style="display: flex; flex-direction: column; gap: 10px;">
      <div style="display: flex; align-items: baseline; gap: 8px; padding: 0 16px; height: 24px;">
        <h2 style="margin: 0; font-family: 'Unbounded', sans-serif; font-weight: 600; font-size: 15px; letter-spacing: -0.02em; color: #F5F3EE;">Ролики</h2>
        <span style="font-size: 12px; font-weight: 500; color: #A4A1B2; font-variant-numeric: tabular-nums;">пока нет</span>
      </div>
      <div style="margin: 0 16px; height: 132px; border-radius: 22px; border: 1px dashed #3A3747; background: #111119; box-sizing: border-box; padding: 16px; display: flex; align-items: center; gap: 14px; overflow: hidden;">
          <div style="position: relative; width: 84px; height: 96px; flex-shrink: 0;">
            <img src="../img/f05.jpg" alt="" style="position: absolute; left: 0; top: 10px; width: 58px; height: 80px; object-fit: cover; border-radius: 12px; transform: rotate(-7deg); opacity: 0.55;">
            <img src="../img/f09.jpg" alt="" style="position: absolute; right: 0; top: 4px; width: 58px; height: 80px; object-fit: cover; border-radius: 12px; transform: rotate(6deg); box-shadow: 0 8px 20px rgba(0,0,0,0.5);">
          </div>
          <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px; align-items: flex-start;">
            <span style="font-size: 13px; line-height: 18px; font-weight: 500; color: #A4A1B2; text-wrap: pretty;">Нейросеть выберет лучшие моменты и положит на музыку.</span>
            <button type="button" style="height: 36px; padding: 0 14px; border: none; border-radius: 999px; background: #F5F3EE; color: #0B0B12; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px; cursor: pointer;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Смонтировать</button>
          </div>
        </div>
    </section>


    <div style="display: flex; align-items: baseline; gap: 8px; padding: 22px 16px 10px;">
      <h2 style="margin: 0; font-family: 'Unbounded', sans-serif; font-weight: 600; font-size: 15px; letter-spacing: -0.02em; color: #F5F3EE;">Кадры</h2>
      <span style="font-size: 12px; font-weight: 500; color: #A4A1B2; font-variant-numeric: tabular-nums;">486 кадров</span>
    </div>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2px;">
      <div style="position: relative; height: 129px; overflow: hidden;"><img src="../img/f06.jpg" alt="" style="width: 100%; height: 129px; object-fit: cover; display: block;"></div>
      <div style="position: relative; height: 129px; overflow: hidden;"><img src="../img/f11.jpg" alt="" style="width: 100%; height: 129px; object-fit: cover; display: block;"></div>
      <div style="position: relative; height: 129px; overflow: hidden;"><img src="../img/f01.jpg" alt="" style="width: 100%; height: 129px; object-fit: cover; display: block;"></div>
      <div style="position: relative; height: 129px; overflow: hidden;"><img src="../img/f05.jpg" alt="" style="width: 100%; height: 129px; object-fit: cover; display: block;"><span style="position: absolute; right: 7px; bottom: 6px; display: flex; align-items: center; gap: 3px; color: #FFFFFF; font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums; text-shadow: 0 1px 4px rgba(0,0,0,0.7);"><svg width="9" height="9" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.2v13.6L19 12z"></path></svg>0:24</span></div>
      <div style="position: relative; height: 129px; overflow: hidden;"><img src="../img/f08.jpg" alt="" style="width: 100%; height: 129px; object-fit: cover; display: block;"></div>
      <div style="position: relative; height: 129px; overflow: hidden;"><img src="../img/f09.jpg" alt="" style="width: 100%; height: 129px; object-fit: cover; display: block;"></div>
      <div style="position: relative; height: 129px; overflow: hidden;"><img src="../img/f12.jpg" alt="" style="width: 100%; height: 129px; object-fit: cover; display: block;"></div>
      <div style="position: relative; height: 129px; overflow: hidden;"><img src="../img/f02.jpg" alt="" style="width: 100%; height: 129px; object-fit: cover; display: block;"></div>
      <div style="position: relative; height: 129px; overflow: hidden;"><img src="../img/f07.jpg" alt="" style="width: 100%; height: 129px; object-fit: cover; display: block;"></div>
      <div style="position: relative; height: 129px; overflow: hidden;"><img src="../img/f04.jpg" alt="" style="width: 100%; height: 129px; object-fit: cover; display: block;"></div>
      <div style="position: relative; height: 129px; overflow: hidden;"><img src="../img/f03.jpg" alt="" style="width: 100%; height: 129px; object-fit: cover; display: block;"></div>
      <div style="position: relative; height: 129px; overflow: hidden;"><img src="../img/f10.jpg" alt="" style="width: 100%; height: 129px; object-fit: cover; display: block;"></div>
    </div>
  </div>


  <!-- Верх: затемнение по фото, три кнопки. Средняя — имя воспоминания и вход в его настройки -->
  <div style="position: absolute; left: 0; top: 0; right: 0; height: 176px; background: linear-gradient(to bottom, rgba(11,11,18,0.94) 0%, rgba(11,11,18,0.72) 38%, rgba(11,11,18,0) 100%); pointer-events: none;"></div>
  <div style="position: absolute; left: 12px; right: 12px; top: 52px; display: flex; align-items: center; gap: 8px;">
    <button type="button" aria-label="Назад" style="position: relative; width: 48px; height: 48px; border-radius: 999px; background: rgba(22,22,31,0.62); backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px); border: 1px solid rgba(255,255,255,0.09); box-sizing: border-box; color: #F5F3EE; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; flex-shrink: 0;"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></button>
    <button type="button" aria-label="Свадьба Лизы и Марка. Настройки воспоминания и люди" style="flex-grow: 1; min-width: 0; height: 48px; border-radius: 999px; background: rgba(22,22,31,0.62); backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px); border: 1px solid rgba(255,255,255,0.09); box-sizing: border-box; color: #F5F3EE; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 0 16px; cursor: pointer;">
      <span style="max-width: 100%; display: flex; align-items: center; gap: 5px;">
        <span style="min-width: 0; font-family: 'Unbounded', sans-serif; font-weight: 600; font-size: 14px; line-height: 17px; letter-spacing: -0.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Свадьба Лизы и Марка</span>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#A4A1B2" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0;"><path d="m6 9 6 6 6-6"></path></svg>
      </span>
      <span style="max-width: 100%; font-size: 11px; line-height: 14px; font-weight: 500; color: #A4A1B2; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">12–14 сентября · 6 человек</span>
    </button>
    <button type="button" aria-label="Выбрать" style="position: relative; width: 48px; height: 48px; border-radius: 999px; background: rgba(22,22,31,0.62); backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px); border: 1px solid rgba(255,255,255,0.09); box-sizing: border-box; color: #F5F3EE; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; flex-shrink: 0;"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="m8 12 3 3 5-6"></path></svg></button>
  </div>


  <!-- Низ как был: слева отбор, справа раскладка, между ними главное действие -->
  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 190px; background: linear-gradient(to top, rgba(11,11,18,0.96) 0%, rgba(11,11,18,0.78) 40%, rgba(11,11,18,0) 100%); pointer-events: none;"></div>
  <div style="position: absolute; left: 16px; right: 16px; bottom: 30px; display: flex; align-items: center; gap: 10px;">
    <button type="button" aria-label="Фильтры" style="position: relative; width: 56px; height: 56px; border-radius: 999px; background: rgba(22,22,31,0.62); backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px); border: 1px solid rgba(255,255,255,0.09); box-sizing: border-box; color: #F5F3EE; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; flex-shrink: 0;"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h18l-7 8.2V20l-4-2.2v-4.6z"></path></svg></button>
    <button type="button" style="flex-grow: 1; height: 56px; border: none; border-radius: 999px; background: #4B5BFF; color: #FFFFFF; font-size: 16px; font-weight: 600; letter-spacing: -0.01em; display: flex; align-items: center; justify-content: center; gap: 9px; cursor: pointer; box-shadow: 0 12px 32px rgba(75,91,255,0.38);"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Добавить ещё</button>
    <button type="button" aria-label="Сортировка" style="position: relative; width: 56px; height: 56px; border-radius: 999px; background: rgba(22,22,31,0.62); backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px); border: 1px solid rgba(255,255,255,0.09); box-sizing: border-box; color: #F5F3EE; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; flex-shrink: 0;"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 20V4"></path><path d="m4 7 3-3 3 3"></path><path d="M17 4v16"></path><path d="m14 17 3 3 3-3"></path></svg></button>
  </div>

</div>
</body>
</html>
