<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Код из письма</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&amp;family=Onest:wght@400;500;600;700&amp;display=swap">
<style>
body { margin: 0; font-family: 'Onest', ui-sans-serif, system-ui, sans-serif; background: #0B0B12; color: #F5F3EE; -webkit-font-smoothing: antialiased; overflow: hidden; }
html { overflow: hidden; }
a { color: #A7AEFF; }
button { font-family: inherit; }
input { font-family: inherit; }
</style>
</head>
<body>

<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0B0B12; position: relative; overflow: hidden;">

  <!-- Один прогресс на весь онбординг: видно, сколько шагов осталось. Apple и Google перепрыгивают со второго на четвёртый -->
  <div role="progressbar" aria-valuenow="3" aria-valuemin="1" aria-valuemax="5" aria-label="Шаг 3 из 5" style="position: absolute; left: 16px; right: 16px; top: 58px; display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px;"><span style="height: 4px; border-radius: 999px; background: #F5F3EE;"></span><span style="height: 4px; border-radius: 999px; background: #F5F3EE;"></span><span style="height: 4px; border-radius: 999px; background: #F5F3EE;"></span><span style="height: 4px; border-radius: 999px; background: #2C2C3A;"></span><span style="height: 4px; border-radius: 999px; background: #2C2C3A;"></span></div>
  <button type="button" aria-label="Назад" style="position: absolute; left: 10px; top: 70px; z-index: 2; width: 44px; height: 44px; border: none; border-radius: 999px; background: transparent; color: #F5F3EE; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></button>

  <!-- Шаг 3 — из ленты получается ролик -->
  <div style="position: absolute; left: 0; top: 112px; right: 0; height: 90px; display: flex; justify-content: center;">
    <div style="position: relative; width: 224px; height: 90px; border-radius: 16px; overflow: hidden; border: 1px solid #2C2C3A;">
      <img src="../img/f11.jpg" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block;">
      <span style="position: absolute; inset: 0; background: linear-gradient(to top, rgba(11,11,18,0.85) 0%, rgba(11,11,18,0.1) 60%);"></span>
      <span style="position: absolute; left: 50%; top: 26px; margin-left: -19px; width: 38px; height: 38px; border-radius: 999px; background: #F5F3EE; color: #0B0B12; display: flex; align-items: center; justify-content: center;"><svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.6v12.8a1 1 0 0 0 1.5.87l11-6.4a1 1 0 0 0 0-1.74l-11-6.4A1 1 0 0 0 8 5.6Z"></path></svg></span>
      <span style="position: absolute; left: 12px; right: 12px; bottom: 12px; height: 3px; border-radius: 999px; background: rgba(245,243,238,0.28);"><span style="display: block; width: 38%; height: 3px; border-radius: 999px; background: #E4FF4F;"></span></span>
    </div>
  </div>
  <div style="position: absolute; left: 0; top: 214px; right: 0; padding: 0 24px; display: flex; flex-direction: column; align-items: center; gap: 10px;">
    <h1 style="margin: 0; font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 26px; line-height: 30px; letter-spacing: -0.04em; color: #F5F3EE; text-align: center;">И сразу ролик</h1>
    <p style="margin: 0; font-size: 15px; line-height: 21px; font-weight: 400; color: #A4A1B2; text-align: center; text-wrap: pretty;">Из общей ленты нейросеть соберёт ролик — каким, решаете вы.</p>
  </div>

  <!-- Адрес и «ещё раз» стоят над клетками: под клетками ничего нет, клавиатуре нечего перекрывать -->
  <div style="position: absolute; left: 16px; right: 16px; top: 312px; display: flex; flex-direction: column; gap: 8px;">
    <div style="display: flex; align-items: center; gap: 10px; padding-left: 4px;">
      <span style="flex-grow: 1; min-width: 0; font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #A4A1B2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Код на liza@example.com</span>
      <button type="button" style="height: 32px; padding: 0 12px; margin-right: -8px; border: none; border-radius: 999px; background: #22222E; color: #F5F3EE; font-size: 12px; font-weight: 600; cursor: pointer; flex-shrink: 0;">Ещё раз</button>
    </div>
    <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px;"><input id="code1" type="text" inputmode="numeric" maxlength="1" value="3" aria-label="Знак кода 1" style="height: 62px; box-sizing: border-box; border-radius: 16px; background: #16161F; border: 1px solid #2C2C3A; outline: none; color: #F5F3EE; font-family: 'Unbounded', sans-serif; font-size: 22px; font-weight: 600; text-align: center; padding: 0;"><input type="text" inputmode="numeric" maxlength="1" value="8" aria-label="Знак кода 2" style="height: 62px; box-sizing: border-box; border-radius: 16px; background: #16161F; border: 1px solid #2C2C3A; outline: none; color: #F5F3EE; font-family: 'Unbounded', sans-serif; font-size: 22px; font-weight: 600; text-align: center; padding: 0;"><input type="text" inputmode="numeric" maxlength="1" value="1" aria-label="Знак кода 3" style="height: 62px; box-sizing: border-box; border-radius: 16px; background: #16161F; border: 1px solid #2C2C3A; outline: none; color: #F5F3EE; font-family: 'Unbounded', sans-serif; font-size: 22px; font-weight: 600; text-align: center; padding: 0;"><input type="text" inputmode="numeric" maxlength="1" value="5" aria-label="Знак кода 4" style="height: 62px; box-sizing: border-box; border-radius: 16px; background: #16161F; border: 1px solid #2C2C3A; outline: none; color: #F5F3EE; font-family: 'Unbounded', sans-serif; font-size: 22px; font-weight: 600; text-align: center; padding: 0;"><input type="text" inputmode="numeric" maxlength="1" value="" aria-label="Знак кода 5" style="height: 62px; box-sizing: border-box; border-radius: 16px; background: #16161F; border: 1px solid #4B5BFF; outline: none; color: #F5F3EE; font-family: 'Unbounded', sans-serif; font-size: 22px; font-weight: 600; text-align: center; padding: 0;"><input type="text" inputmode="numeric" maxlength="1" value="" aria-label="Знак кода 6" style="height: 62px; box-sizing: border-box; border-radius: 16px; background: #16161F; border: 1px solid #2C2C3A; outline: none; color: #F5F3EE; font-family: 'Unbounded', sans-serif; font-size: 22px; font-weight: 600; text-align: center; padding: 0;"></div>
  </div>
  <div style="position: absolute; left: 16px; right: 16px; bottom: 34px;">
    <button type="button" style="width: 100%; height: 56px; border: none; border-radius: 999px; background: #4B5BFF; color: #FFFFFF; font-size: 16px; font-weight: 600; letter-spacing: -0.01em; cursor: pointer; box-shadow: 0 12px 32px rgba(75,91,255,0.38);">Подтвердить</button>
  </div>

</div>
</body>
</html>
