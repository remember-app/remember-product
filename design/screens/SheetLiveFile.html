<!doctype html>

<style>

<div style="width: 390px; height: 640px; box-sizing: border-box; background: #16161F; border-top: 1px solid #2C2C3A; border-radius: 28px 28px 0 0; padding: 12px 16px 30px; display: flex; flex-direction: column; gap: 14px;">

  <div style="position: relative; height: 220px; border-radius: 18px; overflow: hidden;">
    <img src="../img/f01.jpg" alt="IMG_2041" style="width: 100%; height: 100%; object-fit: cover; display: block;">
    <span aria-hidden="true" style="position: absolute; left: 118px; top: 56px; width: 110px; height: 110px; border: 2px solid #E4FF4F; border-radius: 16px;"></span>
  </div>

  <div style="display: flex; align-items: center; gap: 10px;">
    <span aria-hidden="true" style="width: 32px; height: 32px; border-radius: 999px; background: #7A4B3A; border: 1.5px solid transparent; box-sizing: border-box; color: #F5F3EE; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">АП</span>
    <span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px;"><span style="font-size: 14px; font-weight: 600; color: #F5F3EE;">IMG_2041 · фото</span><span style="font-size: 12px; font-weight: 500; color: #A4A1B2; font-variant-numeric: tabular-nums;">Аня Петрова · 13 сентября, 16:42</span></span>
    <span style="display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 999px; background: #E4FF4F; color: #14160A; font-size: 11px; font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums;">Беру</span>

  <div style="display: flex; flex-direction: column; gap: 8px;">
    <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #A4A1B2;">Что увидел</span>
    <div style="display: flex; flex-wrap: wrap; gap: 6px;"><span style="height: 28px; padding: 0 10px; border-radius: 999px; background: #22222E; color: #F5F3EE; font-size: 12px; font-weight: 500; display: inline-flex; align-items: center;">Бабушка</span><span style="height: 28px; padding: 0 10px; border-radius: 999px; background: #22222E; color: #F5F3EE; font-size: 12px; font-weight: 500; display: inline-flex; align-items: center;">Лиза</span><span style="height: 28px; padding: 0 10px; border-radius: 999px; background: #22222E; color: #F5F3EE; font-size: 12px; font-weight: 500; display: inline-flex; align-items: center;">смех</span><span style="height: 28px; padding: 0 10px; border-radius: 999px; background: #22222E; color: #F5F3EE; font-size: 12px; font-weight: 500; display: inline-flex; align-items: center;">объятие</span><span style="height: 28px; padding: 0 10px; border-radius: 999px; background: #22222E; color: #F5F3EE; font-size: 12px; font-weight: 500; display: inline-flex; align-items: center;">тёплый свет</span><span style="height: 28px; padding: 0 10px; border-radius: 999px; background: #22222E; color: #F5F3EE; font-size: 12px; font-weight: 500; display: inline-flex; align-items: center;">лица в фокусе</span></div>

  <div style="display: flex; gap: 10px; align-items: flex-start; padding: 12px; border-radius: 16px; background: #14152A; border: 1px solid rgba(75,91,255,0.35);">
    <span aria-hidden="true" style="width: 22px; height: 22px; border-radius: 999px; background: #E4FF4F; color: #14160A; display: flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M18 6l-2.5 2.5M8.5 15.5 6 18"></path></svg></span>
