<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Доступ к галерее</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&amp;family=Onest:wght@400;500;600;700&amp;display=swap">
<style>
body { margin: 0; font-family: 'Onest', ui-sans-serif, system-ui, sans-serif; background: #0B0B12; color: #F5F3EE; -webkit-font-smoothing: antialiased; overflow: hidden; }
html { overflow: hidden; }
button { font-family: inherit; }
</style>
</head>
<body>

<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0B0B12; position: relative; overflow: hidden;">
  <div style="position: absolute; left: 0; top: 108px; right: 0; bottom: 0; padding: 0 16px;">
    <div style="padding: 20px; border-radius: 22px; background: #16161F; border: 1px solid #2C2C3A; display: flex; flex-direction: column; gap: 16px;">
      <span aria-hidden="true" style="width: 52px; height: 52px; border-radius: 16px; background: #22222E; color: #F5F3EE; display: flex; align-items: center; justify-content: center;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"></rect><circle cx="8.5" cy="10" r="1.6"></circle><path d="m4 17 5-4.5 4 3.5 3-2.5 4 3.5"></path></svg>
      </span>
      <p style="margin: 0; font-size: 15px; line-height: 22px; font-weight: 400; color: #A4A1B2;">Remember не видит вашу галерею, пока вы не разрешите, — а выбранное остаётся на телефоне, пока вы не отправите его.</p>
      <button type="button" style="width: 100%; height: 52px; border: none; border-radius: 999px; background: #4B5BFF; color: #FFFFFF; font-size: 15px; font-weight: 600; cursor: pointer;">Разрешить доступ</button>
    </div>
  </div>
  <div style="position: absolute; left: 0; top: 0; right: 0; height: 176px; background: linear-gradient(to bottom, rgba(11,11,18,0.94) 0%, rgba(11,11,18,0.72) 38%, rgba(11,11,18,0) 100%); pointer-events: none;"></div>
  <div style="position: absolute; left: 12px; right: 12px; top: 52px; display: flex; align-items: center; gap: 8px;">
    <button type="button" aria-label="Назад к моим кадрам" style="position: relative; width: 48px; height: 48px; border-radius: 999px; background: rgba(22,22,31,0.62); backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px); border: 1px solid rgba(255,255,255,0.09); box-sizing: border-box; color: #F5F3EE; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; flex-shrink: 0;"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></button>
    <div style="flex-grow: 1; min-width: 0; height: 48px; border-radius: 999px; background: rgba(22,22,31,0.62); backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px); border: 1px solid rgba(255,255,255,0.09); box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 0 16px;">
      <h1 style="margin: 0; max-width: 100%; font-family: 'Unbounded', sans-serif; font-weight: 600; font-size: 14px; line-height: 17px; letter-spacing: -0.02em; color: #F5F3EE; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Добавить кадры</h1>
      <span style="max-width: 100%; font-size: 11px; line-height: 14px; font-weight: 500; color: #A4A1B2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">в «Свадьба Лизы и Марка»</span>
    </div>
    <span style="width: 48px; flex-shrink: 0;"></span>
  </div>
</div>

</body>
</html>
