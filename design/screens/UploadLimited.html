<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Ограниченный доступ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&amp;family=Onest:wght@400;500;600;700&amp;display=swap">
<style>
body { margin: 0; font-family: 'Onest', ui-sans-serif, system-ui, sans-serif; background: #0B0B12; color: #F5F3EE; -webkit-font-smoothing: antialiased; overflow: hidden; }
html { overflow: hidden; }
button { font-family: inherit; }
</style>
</head>
<body>

<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0B0B12; position: relative; overflow: hidden;">
  <div style="position: absolute; left: 0; right: 0; top: 108px;">
    <div style="margin: 0 16px 14px; padding: 14px 16px; border-radius: 18px; background: #16161F; border: 1px solid #2C2C3A; display: flex; align-items: flex-start; gap: 12px;">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#E4FF4F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px;"><circle cx="12" cy="12" r="9"></circle><path d="M12 8h.01M11 12h1v4h1"></path></svg>
      <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 12px;">
        <span style="font-size: 13px; line-height: 19px; font-weight: 500; color: #A4A1B2;">Здесь только те снимки, что вы отдали Remember, — остальная галерея этому экрану не видна, и «Выбрать все» в каждом дне тоже.</span>
        <button type="button" style="align-self: flex-start; height: 40px; padding: 0 16px; border: 1px solid #45424F; border-radius: 999px; background: transparent; color: #F5F3EE; font-size: 13px; font-weight: 600; cursor: pointer;">Отдать ещё</button>
      </div>
    </div>
    <div style="height: 20px; display: flex; align-items: center;"><span style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 6px;"><span style="font-size: 10px; line-height: 12px; font-weight: 600; letter-spacing: 0.03em; color: #F5F3EE; font-variant-numeric: tabular-nums;">13 сентября, суббота</span><span style="font-size: 10px; line-height: 12px; font-weight: 500; color: #6E6B7D; font-variant-numeric: tabular-nums;">3 из 61</span></span></div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2px;">
      <div style="position: relative; height: 129px; overflow: hidden;"><img src="../img/f03.jpg" alt="" style="width: 100%; height: 129px; object-fit: cover; display: block;"><span style="position: absolute; inset: 0; background: rgba(11,11,18,0.30);"></span><span style="position: absolute; right: 7px; top: 7px; width: 24px; height: 24px; border-radius: 999px; background: #4B5BFF; border: 2px solid #FFFFFF; box-sizing: border-box; color: #FFFFFF; display: flex; align-items: center; justify-content: center;"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg></span></div>
      <div style="position: relative; height: 129px; overflow: hidden;"><img src="../img/f10.jpg" alt="" style="width: 100%; height: 129px; object-fit: cover; display: block;"><span style="position: absolute; right: 7px; top: 7px; width: 24px; height: 24px; border-radius: 999px; border: 2px solid rgba(255,255,255,0.85); background: rgba(11,11,18,0.18); box-sizing: border-box;"></span></div>
      <div style="position: relative; height: 129px; overflow: hidden;"><img src="../img/f06.jpg" alt="" style="width: 100%; height: 129px; object-fit: cover; display: block;"><span style="position: absolute; right: 7px; top: 7px; width: 24px; height: 24px; border-radius: 999px; border: 2px solid rgba(255,255,255,0.85); background: rgba(11,11,18,0.18); box-sizing: border-box;"></span></div>
    </div>
    <div style="margin: 14px 16px 0; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 24px 16px; border-radius: 18px; border: 1px dashed #2C2C3A;">
      <span style="font-size: 13px; font-weight: 500; color: #6E6B7D; text-align: center;">Остальное с этого дня Remember не видит</span>
    </div>
  </div>
  <div style="position: absolute; left: 0; top: 0; right: 0; height: 176px; background: linear-gradient(to bottom, rgba(11,11,18,0.94) 0%, rgba(11,11,18,0.72) 38%, rgba(11,11,18,0) 100%); pointer-events: none;"></div>
  <div style="position: absolute; left: 12px; right: 12px; top: 52px; display: flex; align-items: center; gap: 8px;">
    <button type="button" aria-label="Назад к моим кадрам" style="position: relative; width: 48px; height: 48px; border-radius: 999px; background: rgba(22,22,31,0.62); backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px); border: 1px solid rgba(255,255,255,0.09); box-sizing: border-box; color: #F5F3EE; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; flex-shrink: 0;"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></button>
    <div style="flex-grow: 1; min-width: 0; height: 48px; border-radius: 999px; background: rgba(22,22,31,0.62); backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px); border: 1px solid rgba(255,255,255,0.09); box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 0 16px;">
      <h1 style="margin: 0; max-width: 100%; font-family: 'Unbounded', sans-serif; font-weight: 600; font-size: 14px; line-height: 17px; letter-spacing: -0.02em; color: #F5F3EE; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Добавить кадры</h1>
      <span style="max-width: 100%; font-size: 11px; line-height: 14px; font-weight: 500; color: #A4A1B2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">в «Свадьба Лизы и Марка»</span>
    </div>
    <button type="button" aria-pressed="true" aria-label="Режим выбора" style="position: relative; width: 48px; height: 48px; border-radius: 999px; background: #4B5BFF; border: 1px solid rgba(255,255,255,0.14); box-sizing: border-box; color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; flex-shrink: 0; box-shadow: 0 6px 18px rgba(75,91,255,0.4);"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="m8 12 3 3 5-6"></path></svg></button>
  </div>
  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 176px; background: linear-gradient(to top, #0B0B12 62%, rgba(11,11,18,0) 100%); pointer-events: none;"></div>
  <div style="position: absolute; left: 16px; right: 16px; bottom: 30px; display: flex; flex-direction: column; gap: 12px;">
    <div style="display: flex; align-items: center; gap: 12px;">
      <span style="flex-grow: 1; font-size: 13px; font-weight: 600; color: #F5F3EE; font-variant-numeric: tabular-nums;">Выбрано 1 из 3</span>
      <button type="button" style="height: 44px; padding: 0 14px; margin-right: -14px; border: none; border-radius: 999px; background: transparent; color: #A4A1B2; font-size: 14px; font-weight: 600; cursor: pointer;">Снять</button>
    </div>
    <button type="button" style="width: 100%; height: 56px; border: none; border-radius: 999px; background: #4B5BFF; color: #FFFFFF; font-size: 16px; font-weight: 600; letter-spacing: -0.01em; display: flex; align-items: center; justify-content: center; gap: 9px; cursor: pointer; box-shadow: 0 12px 32px rgba(75,91,255,0.38); font-variant-numeric: tabular-nums;">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5"></path><path d="m5 12 7-7 7 7"></path></svg>
      Отправить 1 файл
    </button>
  </div>
</div>
