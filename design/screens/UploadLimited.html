<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Ограниченный доступ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&amp;family=Onest:wght@400;500;600;700&amp;display=swap">
<style>
body { margin: 0; font-family: 'Onest', ui-sans-serif, system-ui, sans-serif; background: #0B0B12; color: #F5F3EE; -webkit-font-smoothing: antialiased; overflow: hidden; }
html { overflow: hidden; }
button { font-family: inherit; }
</style>
</head>
<body>

<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0B0B12; position: relative; overflow: hidden;">
  <div style="position: absolute; left: 0; top: 0; right: 0; padding: 52px 16px 0;">
    <div style="display: flex; align-items: center; gap: 8px; height: 44px;">
      <button type="button" aria-label="Назад" style="width: 44px; height: 44px; margin-left: -10px; border: none; border-radius: 999px; background: transparent; color: #F5F3EE; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; flex-shrink: 0;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
      </button>
      <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
        <h1 style="margin: 0; font-family: 'Unbounded', sans-serif; font-weight: 600; font-size: 18px; line-height: 21px; letter-spacing: -0.03em; color: #F5F3EE;">Ваши кадры</h1>
        <span style="font-size: 12px; font-weight: 500; color: #A4A1B2; font-variant-numeric: tabular-nums;">Свадьба Лизы и Марка · 12–14 сентября</span>
      </div>
    </div>
  </div>
  <div style="position: absolute; left: 0; top: 124px; right: 0; bottom: 0; padding: 0 16px; overflow: hidden;">
    <div style="display: flex; align-items: flex-start; gap: 12px; padding: 14px 16px; border-radius: 18px; background: #16161F; border: 1px solid #2C2C3A;">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#E4FF4F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px;"><circle cx="12" cy="12" r="9"></circle><path d="M12 8h.01M11 12h1v4h1"></path></svg>
      <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 12px;">
        <span style="font-size: 13px; line-height: 19px; font-weight: 500; color: #A4A1B2;">Здесь только те снимки, что вы отдали Remember, — остальная галерея этому экрану не видна, и «Выбрать все» в каждом дне тоже.</span>
        <button type="button" style="align-self: flex-start; height: 40px; padding: 0 16px; border: 1px solid #45424F; border-radius: 999px; background: transparent; color: #F5F3EE; font-size: 13px; font-weight: 600; cursor: pointer;">Отдать ещё</button>
      </div>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; height: 56px;">
      <span style="font-size: 13px; font-weight: 600; color: #F5F3EE;">Снято 13 сентября</span>
      <span style="flex-grow: 1; height: 1px; background: #2C2C3A;"></span>
      <span style="font-size: 12px; font-weight: 500; color: #6E6B7D; font-variant-numeric: tabular-nums;">3 из 61</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 3px;">
      <div style="position: relative;">
        <img src="../img/f03.jpg" alt="" style="width: 100%; height: 117px; object-fit: cover; border-radius: 4px; display: block;">
        <span style="position: absolute; inset: 0; border-radius: 4px; box-shadow: inset 0 0 0 3px #4B5BFF; background: rgba(11,11,18,0.28);"></span>
        <span style="position: absolute; right: 6px; top: 6px; width: 22px; height: 22px; border-radius: 999px; background: #4B5BFF; color: #FFFFFF; display: flex; align-items: center; justify-content: center;">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg>
        </span>
      </div>
      <img src="../img/f10.jpg" alt="" style="width: 100%; height: 117px; object-fit: cover; border-radius: 4px; display: block;">
      <img src="../img/f06.jpg" alt="" style="width: 100%; height: 117px; object-fit: cover; border-radius: 4px; display: block;">
    </div>
    <div style="margin-top: 22px; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 24px 16px; border-radius: 18px; border: 1px dashed #2C2C3A;">
      <span style="font-size: 13px; font-weight: 500; color: #6E6B7D; text-align: center;">Остальное с этого дня Remember не видит</span>
    </div>
  </div>
  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 176px; background: linear-gradient(to top, #0B0B12 62%, rgba(11,11,18,0) 100%); pointer-events: none;"></div>
  <div style="position: absolute; left: 16px; right: 16px; bottom: 30px; display: flex; flex-direction: column; gap: 12px;">
    <div style="display: flex; align-items: center; gap: 12px;">
      <span style="flex-grow: 1; font-size: 13px; font-weight: 600; color: #F5F3EE; font-variant-numeric: tabular-nums;">Выбрано 1 из 3</span>
      <button type="button" style="height: 44px; padding: 0 14px; margin-right: -14px; border: none; border-radius: 999px; background: transparent; color: #A4A1B2; font-size: 14px; font-weight: 600; cursor: pointer;">Снять</button>
    </div>
    <button type="button" style="width: 100%; height: 56px; border: none; border-radius: 999px; background: #4B5BFF; color: #FFFFFF; font-size: 16px; font-weight: 600; letter-spacing: -0.01em; display: flex; align-items: center; justify-content: center; gap: 9px; cursor: pointer; box-shadow: 0 12px 32px rgba(75,91,255,0.38); font-variant-numeric: tabular-nums;">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5"></path><path d="m5 12 7-7 7 7"></path></svg>
      Отправить 1 файл
    </button>
  </div>
</div>

</body>
</html>
