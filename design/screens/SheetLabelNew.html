<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Компонент: новый лейбл</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&amp;family=Onest:wght@400;500;600;700&amp;display=swap">
<style>
body { margin: 0; font-family: 'Onest', ui-sans-serif, system-ui, sans-serif; background: #16161F; color: #F5F3EE; -webkit-font-smoothing: antialiased; overflow: hidden; }
html { overflow: hidden; }
a { color: inherit; text-decoration: none; }
button { font-family: inherit; }
</style>
</head>
<body>

<div style="width: 390px; height: 600px; box-sizing: border-box; background: #16161F; border-top: 1px solid #2C2C3A; border-radius: 28px 28px 0 0; padding: 12px 16px 30px; display: flex; flex-direction: column; gap: 18px;">
  <span style="width: 40px; height: 4px; border-radius: 999px; background: #3A3747; align-self: center;"></span>
  <h2 style="margin: 0; font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 22px; line-height: 26px; letter-spacing: -0.03em; color: #F5F3EE;">Новый лейбл</h2>
  <div style="display: flex; flex-direction: column; gap: 8px;">
    <label for="label-name" style="font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #A4A1B2;">Название</label>
    <div style="display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 12px; border-radius: 16px; background: #0B0B12; border: 1px solid #4B5BFF; box-sizing: border-box;">
      <span aria-hidden="true" style="width: 28px; height: 28px; border-radius: 9px; background: #FF7A9C; color: #0B0B12; display: flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#0B0B12" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8Z"></path><circle cx="7.5" cy="7.5" r="1.5"></circle></svg></span>
      <input id="label-name" type="text" value="Для бабушки" style="flex-grow: 1; min-width: 0; background: transparent; border: none; outline: none; color: #F5F3EE; font-family: inherit; font-size: 16px; font-weight: 600; padding: 0;">
    </div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 10px;">
    <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #A4A1B2;">Цвет</span>
    <div role="group" aria-label="Цвет лейбла" style="display: flex; justify-content: space-between;"><button type="button" aria-label="Цвет 1" aria-pressed="false" style="width: 36px; height: 36px; border-radius: 999px; background: #FFB547; border: none; cursor: pointer; padding: 0; "></button><button type="button" aria-label="Цвет 2" aria-pressed="true" style="width: 36px; height: 36px; border-radius: 999px; background: #FF7A9C; border: none; cursor: pointer; padding: 0; box-shadow: 0 0 0 3px #16161F, 0 0 0 5px #F5F3EE;"></button><button type="button" aria-label="Цвет 3" aria-pressed="false" style="width: 36px; height: 36px; border-radius: 999px; background: #FF5A5A; border: none; cursor: pointer; padding: 0; "></button><button type="button" aria-label="Цвет 4" aria-pressed="false" style="width: 36px; height: 36px; border-radius: 999px; background: #4BD6A0; border: none; cursor: pointer; padding: 0; "></button><button type="button" aria-label="Цвет 5" aria-pressed="false" style="width: 36px; height: 36px; border-radius: 999px; background: #4FB3FF; border: none; cursor: pointer; padding: 0; "></button><button type="button" aria-label="Цвет 6" aria-pressed="false" style="width: 36px; height: 36px; border-radius: 999px; background: #8A7CFF; border: none; cursor: pointer; padding: 0; "></button><button type="button" aria-label="Цвет 7" aria-pressed="false" style="width: 36px; height: 36px; border-radius: 999px; background: #E4FF4F; border: none; cursor: pointer; padding: 0; "></button><button type="button" aria-label="Цвет 8" aria-pressed="false" style="width: 36px; height: 36px; border-radius: 999px; background: #A4A1B2; border: none; cursor: pointer; padding: 0; "></button></div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 8px;">
    <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #A4A1B2;">Кто видит</span>
    <div style="display: flex; gap: 8px;">
      <button type="button" aria-pressed="true" style="flex: 1; min-width: 0; height: 92px; box-sizing: border-box; border-radius: 18px; border: 1.5px solid #4B5BFF; background: #1A1C33; padding: 12px; display: flex; flex-direction: column; justify-content: space-between; text-align: left; color: #F5F3EE; cursor: pointer;">
        <span style="color: #F5F3EE; display: flex;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"></path></svg></span>
        <span style="display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 14px; font-weight: 600;">Общий</span><span style="font-size: 11px; font-weight: 500; color: #A4A1B2;">видят все участники</span></span>
      </button>
      <button type="button" aria-pressed="false" style="flex: 1; min-width: 0; height: 92px; box-sizing: border-box; border-radius: 18px; border: 1px solid #2C2C3A; background: #0B0B12; padding: 12px; display: flex; flex-direction: column; justify-content: space-between; text-align: left; color: #F5F3EE; cursor: pointer;">
        <span style="color: #A4A1B2; display: flex;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg></span>
        <span style="display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 14px; font-weight: 600;">Личный</span><span style="font-size: 11px; font-weight: 500; color: #A4A1B2;">только вы</span></span>
      </button>
    </div>
  </div>
  <span style="flex-grow: 1;"></span>
  <button type="button" style="width: 100%; height: 56px; border: none; border-radius: 999px; background: #4B5BFF; color: #FFFFFF; font-size: 16px; font-weight: 600; cursor: pointer; box-shadow: 0 12px 32px rgba(75,91,255,0.38); font-variant-numeric: tabular-nums;">Создать и положить 4 кадра</button>
</div>

</body>
</html>
