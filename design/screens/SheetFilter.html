<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Компонент: фильтры</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&amp;family=Onest:wght@400;500;600;700&amp;display=swap">
<style>
body { margin: 0; font-family: 'Onest', ui-sans-serif, system-ui, sans-serif; background: #16161F; color: #F5F3EE; -webkit-font-smoothing: antialiased; overflow: hidden; }
html { overflow: hidden; }
a { color: inherit; text-decoration: none; }
button { font-family: inherit; }
</style>
</head>
<body>

<div style="width: 390px; height: 650px; box-sizing: border-box; background: #16161F; border-top: 1px solid #2C2C3A; border-radius: 28px 28px 0 0; padding: 12px 16px 30px; display: flex; flex-direction: column; gap: 20px; overflow: hidden;">
  <span style="width: 40px; height: 4px; border-radius: 999px; background: #3A3747; align-self: center;"></span>
  <div style="display: flex; align-items: center; gap: 12px;">
    <h2 style="margin: 0; flex-grow: 1; font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 23px; line-height: 26px; letter-spacing: -0.03em; color: #F5F3EE;">Фильтры</h2>
    <button type="button" style="height: 36px; padding: 0 14px; border: none; border-radius: 999px; background: #22222E; color: #F5F3EE; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px; cursor: pointer;"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg>Сбросить</button>
  </div>
  <div style="display: flex; flex-direction: column; gap: 12px;">
    <div style="display: flex; align-items: center; gap: 10px;">
      <span style="flex-grow: 1; font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #A4A1B2;">Кто принёс</span>
      <button type="button" aria-pressed="false" style="height: 28px; padding: 0 14px; border: 1px solid #3A3747; border-radius: 999px; background: transparent; color: #F5F3EE; font-size: 12px; font-weight: 600; cursor: pointer; flex-shrink: 0;">Все</button>
    </div>
    <div role="group" aria-label="Кто принёс" style="display: flex; align-items: center; justify-content: space-between; padding: 2px 2px 0;"><button type="button" aria-pressed="true" aria-label="Лиза Морозова" style="position: relative; width: 48px; height: 48px; padding: 0; border: none; border-radius: 999px; background: #5B4B8A; color: #F5F3EE; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; box-shadow: 0 0 0 2px #16161F, 0 0 0 4px #F5F3EE; ">ЛМ<span aria-hidden="true" style="position: absolute; right: -2px; bottom: -2px; width: 18px; height: 18px; border-radius: 999px; background: #F5F3EE; color: #0B0B12; border: 2px solid #16161F; box-sizing: border-box; display: flex; align-items: center; justify-content: center;"><svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg></span></button><button type="button" aria-pressed="true" aria-label="Марк Ковалёв" style="position: relative; width: 48px; height: 48px; padding: 0; border: none; border-radius: 999px; background: #2F5E63; color: #F5F3EE; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; box-shadow: 0 0 0 2px #16161F, 0 0 0 4px #F5F3EE; ">МК<span aria-hidden="true" style="position: absolute; right: -2px; bottom: -2px; width: 18px; height: 18px; border-radius: 999px; background: #F5F3EE; color: #0B0B12; border: 2px solid #16161F; box-sizing: border-box; display: flex; align-items: center; justify-content: center;"><svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg></span></button><button type="button" aria-pressed="false" aria-label="Аня Петрова" style="position: relative; width: 48px; height: 48px; padding: 0; border: none; border-radius: 999px; background: #7A4B3A; color: #F5F3EE; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;  opacity: 0.5;">АП</button><button type="button" aria-pressed="false" aria-label="Вера Гущина" style="position: relative; width: 48px; height: 48px; padding: 0; border: none; border-radius: 999px; background: #3E5A2E; color: #F5F3EE; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;  opacity: 0.5;">ВГ</button><button type="button" aria-pressed="false" aria-label="Дима Соколов" style="position: relative; width: 48px; height: 48px; padding: 0; border: none; border-radius: 999px; background: #5A3E5E; color: #F5F3EE; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;  opacity: 0.5;">ДС</button><button type="button" aria-pressed="false" aria-label="Костя Ким" style="position: relative; width: 48px; height: 48px; padding: 0; border: none; border-radius: 999px; background: #3A4A6E; color: #F5F3EE; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;  opacity: 0.5;">КК</button></div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 10px;">
    <div style="display: flex; align-items: center; gap: 10px;">
      <span style="flex-grow: 1; font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #A4A1B2;">Тип</span>
      <button type="button" aria-pressed="true" style="height: 28px; padding: 0 14px; border: none; border-radius: 999px; background: #F5F3EE; color: #0B0B12; font-size: 12px; font-weight: 600; cursor: pointer; flex-shrink: 0;">Все</button>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 999px; background: #0B0B12; border: 1px solid #2C2C3A;"><button type="button" aria-pressed="false" style="height: 40px; border: none; border-radius: 999px; background: transparent; color: #A4A1B2; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 7px; cursor: pointer;">Фото</button><button type="button" aria-pressed="false" style="height: 40px; border: none; border-radius: 999px; background: transparent; color: #A4A1B2; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 7px; cursor: pointer;">Видео</button></div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 10px;">
    <div style="display: flex; align-items: center; gap: 10px;">
      <span style="flex-grow: 1; font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #A4A1B2;">Ориентация</span>
      <button type="button" aria-pressed="true" style="height: 28px; padding: 0 14px; border: none; border-radius: 999px; background: #F5F3EE; color: #0B0B12; font-size: 12px; font-weight: 600; cursor: pointer; flex-shrink: 0;">Все</button>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 999px; background: #0B0B12; border: 1px solid #2C2C3A;"><button type="button" aria-pressed="false" style="height: 40px; border: none; border-radius: 999px; background: transparent; color: #A4A1B2; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 7px; cursor: pointer;">Горизонтальные</button><button type="button" aria-pressed="false" style="height: 40px; border: none; border-radius: 999px; background: transparent; color: #A4A1B2; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 7px; cursor: pointer;">Вертикальные</button></div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 10px;">
    <div style="display: flex; align-items: center; gap: 10px;">
      <span style="flex-grow: 1; font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #A4A1B2;">День</span>
      <button type="button" aria-pressed="false" style="height: 28px; padding: 0 14px; border: 1px solid #3A3747; border-radius: 999px; background: transparent; color: #F5F3EE; font-size: 12px; font-weight: 600; cursor: pointer; flex-shrink: 0;">Все</button>
      <button type="button" aria-label="Выбрать другую дату" style="width: 28px; height: 28px; border: 1px solid #3A3747; border-radius: 999px; background: transparent; color: #F5F3EE; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg></button>
    </div>
    <div role="group" aria-label="Дни воспоминания" style="display: flex; gap: 8px;">
      <button type="button" aria-pressed="false" aria-label="12 сентября, пт, 88 кадров" style="flex: 1; min-width: 0; height: 86px; box-sizing: border-box; border-radius: 18px; background: #0B0B12; border: 1px solid #2C2C3A; padding: 10px 11px; display: flex; flex-direction: column; justify-content: space-between; align-items: stretch; cursor: pointer; text-align: left;">
        <span style="display: flex; align-items: baseline; gap: 5px;">
          <span style="font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 20px; line-height: 22px; letter-spacing: -0.03em; color: #F5F3EE; font-variant-numeric: tabular-nums;">12</span>
          <span style="font-size: 11px; font-weight: 600; color: #A4A1B2;">пт</span>
        </span>
        <span style="display: flex; flex-direction: column; gap: 5px;">
          <span aria-hidden="true" style="height: 4px; border-radius: 999px; background: #22222E; overflow: hidden;"><span style="display: block; width: 28%; height: 100%; border-radius: 999px; background: #6E6B7D;"></span></span>
          <span style="font-size: 11px; font-weight: 600; color: #A4A1B2; font-variant-numeric: tabular-nums;">88 кадров</span>
        </span>
      </button>
      <button type="button" aria-pressed="true" aria-label="13 сентября, сб, 312 кадров" style="flex: 1; min-width: 0; height: 86px; box-sizing: border-box; border-radius: 18px; background: #F5F3EE; border: 1px solid #F5F3EE; padding: 10px 11px; display: flex; flex-direction: column; justify-content: space-between; align-items: stretch; cursor: pointer; text-align: left;">
        <span style="display: flex; align-items: baseline; gap: 5px;">
          <span style="font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 20px; line-height: 22px; letter-spacing: -0.03em; color: #0B0B12; font-variant-numeric: tabular-nums;">13</span>
          <span style="font-size: 11px; font-weight: 600; color: rgba(11,11,18,0.62);">сб</span>
        </span>
        <span style="display: flex; flex-direction: column; gap: 5px;">
          <span aria-hidden="true" style="height: 4px; border-radius: 999px; background: rgba(11,11,18,0.16); overflow: hidden;"><span style="display: block; width: 100%; height: 100%; border-radius: 999px; background: #0B0B12;"></span></span>
          <span style="font-size: 11px; font-weight: 600; color: rgba(11,11,18,0.62); font-variant-numeric: tabular-nums;">312 кадров</span>
        </span>
      </button>
      <button type="button" aria-pressed="false" aria-label="14 сентября, вс, 86 кадров" style="flex: 1; min-width: 0; height: 86px; box-sizing: border-box; border-radius: 18px; background: #0B0B12; border: 1px solid #2C2C3A; padding: 10px 11px; display: flex; flex-direction: column; justify-content: space-between; align-items: stretch; cursor: pointer; text-align: left;">
        <span style="display: flex; align-items: baseline; gap: 5px;">
          <span style="font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 20px; line-height: 22px; letter-spacing: -0.03em; color: #F5F3EE; font-variant-numeric: tabular-nums;">14</span>
          <span style="font-size: 11px; font-weight: 600; color: #A4A1B2;">вс</span>
        </span>
        <span style="display: flex; flex-direction: column; gap: 5px;">
          <span aria-hidden="true" style="height: 4px; border-radius: 999px; background: #22222E; overflow: hidden;"><span style="display: block; width: 28%; height: 100%; border-radius: 999px; background: #6E6B7D;"></span></span>
          <span style="font-size: 11px; font-weight: 600; color: #A4A1B2; font-variant-numeric: tabular-nums;">86 кадров</span>
        </span>
      </button>
    </div>
  </div>
  <span style="flex-grow: 1;"></span>
  <button type="button" style="width: 100%; height: 56px; border: none; border-radius: 999px; background: #4B5BFF; color: #FFFFFF; font-size: 16px; font-weight: 600; letter-spacing: -0.01em; cursor: pointer; box-shadow: 0 12px 32px rgba(75,91,255,0.38); font-variant-numeric: tabular-nums;">Показать 184 кадра</button>
</div>

</body>
</html>
