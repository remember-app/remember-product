<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Компонент: фильтры</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&amp;family=Onest:wght@400;500;600;700&amp;display=swap">
<style>
body { margin: 0; font-family: 'Onest', ui-sans-serif, system-ui, sans-serif; background: #16161F; color: #F5F3EE; -webkit-font-smoothing: antialiased; overflow: hidden; }
html { overflow: hidden; }
button { font-family: inherit; }
</style>
</head>
<body>
<!-- Открывается левой кнопкой низа. Фильтр решает, ЧТО показать -->
<div style="width: 390px; height: 600px; box-sizing: border-box; background: #16161F; border-top: 1px solid #2C2C3A; border-radius: 28px 28px 0 0; padding: 12px 16px 30px; display: flex; flex-direction: column; gap: 18px;">

  <span style="width: 40px; height: 4px; border-radius: 999px; background: #3A3747; align-self: center;"></span>

  <h2 style="margin: 0; font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 23px; line-height: 26px; letter-spacing: -0.03em; color: #F5F3EE;">Фильтры</h2>

  <div style="display: flex; flex-direction: column; gap: 10px;">
    <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #A4A1B2;">Кто принёс</span>
    <div style="display: flex; flex-wrap: wrap; gap: 8px;">
      <button type="button" aria-pressed="true" style="height: 44px; padding: 0 16px; border: none; border-radius: 999px; background: #F5F3EE; color: #0B0B12; font-size: 14px; font-weight: 600; cursor: pointer;">Все</button>
      <button type="button" aria-pressed="false" style="height: 44px; padding: 0 16px 0 6px; border: 1px solid #2C2C3A; border-radius: 999px; background: transparent; color: #F5F3EE; font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 9px; cursor: pointer;">
        <span aria-hidden="true" style="width: 32px; height: 32px; border-radius: 999px; background: #22222E; color: #F5F3EE; font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">ЛМ</span>
        Лиза
      </button>
      <button type="button" aria-pressed="false" style="height: 44px; padding: 0 16px 0 6px; border: 1px solid #2C2C3A; border-radius: 999px; background: transparent; color: #F5F3EE; font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 9px; cursor: pointer;">
        <span aria-hidden="true" style="width: 32px; height: 32px; border-radius: 999px; background: #22222E; color: #F5F3EE; font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">МК</span>
        Марк
      </button>
      <button type="button" aria-pressed="false" style="height: 44px; padding: 0 16px 0 6px; border: 1px solid #2C2C3A; border-radius: 999px; background: transparent; color: #F5F3EE; font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 9px; cursor: pointer;">
        <span aria-hidden="true" style="width: 32px; height: 32px; border-radius: 999px; background: #22222E; color: #F5F3EE; font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">АП</span>
        Аня
      </button>
      <button type="button" aria-pressed="false" style="height: 44px; padding: 0 16px 0 6px; border: 1px solid #2C2C3A; border-radius: 999px; background: transparent; color: #F5F3EE; font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 9px; cursor: pointer;">
        <span aria-hidden="true" style="width: 32px; height: 32px; border-radius: 999px; background: #22222E; color: #F5F3EE; font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">ВГ</span>
        Вера
      </button>
      <button type="button" aria-pressed="false" style="height: 44px; padding: 0 16px 0 6px; border: 1px solid #2C2C3A; border-radius: 999px; background: transparent; color: #F5F3EE; font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 9px; cursor: pointer;">
        <span aria-hidden="true" style="width: 32px; height: 32px; border-radius: 999px; background: #22222E; color: #F5F3EE; font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">ДС</span>
        Дима
      </button>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px;">
    <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #A4A1B2;">Что показывать</span>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 999px; background: #0B0B12; border: 1px solid #2C2C3A;">
      <button type="button" aria-pressed="true" style="height: 40px; border: none; border-radius: 999px; background: #F5F3EE; color: #0B0B12; font-size: 14px; font-weight: 600; cursor: pointer;">Всё</button>
      <button type="button" aria-pressed="false" style="height: 40px; border: none; border-radius: 999px; background: transparent; color: #A4A1B2; font-size: 14px; font-weight: 600; cursor: pointer;">Фото</button>
      <button type="button" aria-pressed="false" style="height: 40px; border: none; border-radius: 999px; background: transparent; color: #A4A1B2; font-size: 14px; font-weight: 600; cursor: pointer;">Видео</button>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px;">
    <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #A4A1B2;">За какие дни</span>
    <div style="display: flex; flex-wrap: wrap; gap: 8px;">
      <button type="button" aria-pressed="true" style="height: 44px; padding: 0 16px; border: none; border-radius: 999px; background: #F5F3EE; color: #0B0B12; font-size: 14px; font-weight: 600; cursor: pointer;">Все дни</button>
      <button type="button" aria-pressed="false" style="height: 44px; padding: 0 16px; border: 1px solid #2C2C3A; border-radius: 999px; background: transparent; color: #F5F3EE; font-size: 14px; font-weight: 500; cursor: pointer; font-variant-numeric: tabular-nums;">12 сентября</button>
      <button type="button" aria-pressed="false" style="height: 44px; padding: 0 16px; border: 1px solid #2C2C3A; border-radius: 999px; background: transparent; color: #F5F3EE; font-size: 14px; font-weight: 500; cursor: pointer; font-variant-numeric: tabular-nums;">13 сентября</button>
      <button type="button" aria-pressed="false" style="height: 44px; padding: 0 16px; border: 1px solid #2C2C3A; border-radius: 999px; background: transparent; color: #F5F3EE; font-size: 14px; font-weight: 500; cursor: pointer; font-variant-numeric: tabular-nums;">14 сентября</button>
    </div>
  </div>

  <span style="flex-grow: 1;"></span>

  <div style="display: flex; flex-direction: column; gap: 4px;">
    <button type="button" style="width: 100%; height: 56px; border: none; border-radius: 999px; background: #4B5BFF; color: #FFFFFF; font-size: 16px; font-weight: 600; letter-spacing: -0.01em; cursor: pointer; box-shadow: 0 12px 32px rgba(75,91,255,0.38); font-variant-numeric: tabular-nums;">Показать 486 кадров</button>
    <button type="button" style="width: 100%; height: 48px; border: none; border-radius: 999px; background: transparent; color: #A4A1B2; font-size: 15px; font-weight: 600; cursor: pointer;">Сбросить фильтры</button>
  </div>

</div>
</body>
</html>
