<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Компонент: фильтры</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&amp;family=Onest:wght@400;500;600;700&amp;display=swap">
<style>
body { margin: 0; font-family: 'Onest', ui-sans-serif, system-ui, sans-serif; background: #16161F; color: #F5F3EE; -webkit-font-smoothing: antialiased; overflow: hidden; }
html { overflow: hidden; }
a { color: inherit; text-decoration: none; }
button { font-family: inherit; }
</style>
</head>
<body>

<div style="width: 390px; height: 560px; box-sizing: border-box; background: #16161F; border-top: 1px solid #2C2C3A; border-radius: 28px 28px 0 0; padding: 12px 16px 30px; display: flex; flex-direction: column; gap: 20px; overflow: hidden;">
  <span style="width: 40px; height: 4px; border-radius: 999px; background: #3A3747; align-self: center;"></span>

  <!-- Фильтр решает, ЧТО показать. Сброс — маленький, в углу: он нужен редко и не должен спорить с главной кнопкой -->
  <div style="display: flex; align-items: center; gap: 12px;">
    <h2 style="margin: 0; flex-grow: 1; font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 23px; line-height: 26px; letter-spacing: -0.03em; color: #F5F3EE;">Фильтры</h2>
    <button type="button" style="height: 36px; padding: 0 14px; border: none; border-radius: 999px; background: #22222E; color: #F5F3EE; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px; cursor: pointer;"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg>Сбросить</button>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px;">
    <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #A4A1B2;">Кто принёс</span>
    <div style="display: flex; flex-wrap: wrap; gap: 8px;"><button type="button" aria-pressed="true" style="height: 40px; padding: 0 14px 0 5px; border-radius: 999px; background: #F5F3EE; color: #0B0B12; border: 1px solid #F5F3EE; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; cursor: pointer; white-space: nowrap; font-variant-numeric: tabular-nums;"><span aria-hidden="true" style="width: 30px; height: 30px; border-radius: 999px; background: #5B4B8A; border: 1.5px solid transparent; box-sizing: border-box; color: #F5F3EE; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">ЛМ</span>Лиза</button><button type="button" aria-pressed="true" style="height: 40px; padding: 0 14px 0 5px; border-radius: 999px; background: #F5F3EE; color: #0B0B12; border: 1px solid #F5F3EE; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; cursor: pointer; white-space: nowrap; font-variant-numeric: tabular-nums;"><span aria-hidden="true" style="width: 30px; height: 30px; border-radius: 999px; background: #2F5E63; border: 1.5px solid transparent; box-sizing: border-box; color: #F5F3EE; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">МК</span>Марк</button><button type="button" aria-pressed="false" style="height: 40px; padding: 0 14px 0 5px; border-radius: 999px; background: transparent; color: #F5F3EE; border: 1px solid #3A3747; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; cursor: pointer; white-space: nowrap; font-variant-numeric: tabular-nums;"><span aria-hidden="true" style="width: 30px; height: 30px; border-radius: 999px; background: #7A4B3A; border: 1.5px solid transparent; box-sizing: border-box; color: #F5F3EE; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">АП</span>Аня</button><button type="button" aria-pressed="false" style="height: 40px; padding: 0 14px 0 5px; border-radius: 999px; background: transparent; color: #F5F3EE; border: 1px solid #3A3747; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; cursor: pointer; white-space: nowrap; font-variant-numeric: tabular-nums;"><span aria-hidden="true" style="width: 30px; height: 30px; border-radius: 999px; background: #3E5A2E; border: 1.5px solid transparent; box-sizing: border-box; color: #F5F3EE; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">ВГ</span>Вера</button><button type="button" aria-pressed="false" style="height: 40px; padding: 0 14px 0 5px; border-radius: 999px; background: transparent; color: #F5F3EE; border: 1px solid #3A3747; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; cursor: pointer; white-space: nowrap; font-variant-numeric: tabular-nums;"><span aria-hidden="true" style="width: 30px; height: 30px; border-radius: 999px; background: #5A3E5E; border: 1.5px solid transparent; box-sizing: border-box; color: #F5F3EE; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">ДС</span>Дима</button><button type="button" aria-pressed="false" style="height: 40px; padding: 0 14px 0 5px; border-radius: 999px; background: transparent; color: #F5F3EE; border: 1px solid #3A3747; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; cursor: pointer; white-space: nowrap; font-variant-numeric: tabular-nums;"><span aria-hidden="true" style="width: 30px; height: 30px; border-radius: 999px; background: #3A4A6E; border: 1.5px solid transparent; box-sizing: border-box; color: #F5F3EE; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">КК</span>Костя</button></div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px;">
    <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #A4A1B2;">Тип</span>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 999px; background: #0B0B12; border: 1px solid #2C2C3A;"><button type="button" aria-pressed="true" style="height: 40px; border: none; border-radius: 999px; background: #F5F3EE; color: #0B0B12; font-size: 14px; font-weight: 600; cursor: pointer;">Всё</button><button type="button" aria-pressed="false" style="height: 40px; border: none; border-radius: 999px; background: transparent; color: #A4A1B2; font-size: 14px; font-weight: 600; cursor: pointer;">Фото</button><button type="button" aria-pressed="false" style="height: 40px; border: none; border-radius: 999px; background: transparent; color: #A4A1B2; font-size: 14px; font-weight: 600; cursor: pointer;">Видео</button></div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px;">
    <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #A4A1B2;">День</span>
    <div style="display: flex; flex-wrap: wrap; gap: 8px;"><button type="button" aria-pressed="false" style="height: 40px; padding: 0 14px; border-radius: 999px; background: transparent; color: #F5F3EE; border: 1px solid #3A3747; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; cursor: pointer; white-space: nowrap; font-variant-numeric: tabular-nums;">Все дни</button><button type="button" aria-pressed="true" style="height: 40px; padding: 0 14px; border-radius: 999px; background: #F5F3EE; color: #0B0B12; border: 1px solid #F5F3EE; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; cursor: pointer; white-space: nowrap; font-variant-numeric: tabular-nums;">13 сент <span style="opacity: 0.6; font-weight: 500;">312</span></button><button type="button" aria-pressed="false" style="height: 40px; padding: 0 14px; border-radius: 999px; background: transparent; color: #F5F3EE; border: 1px solid #3A3747; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; cursor: pointer; white-space: nowrap; font-variant-numeric: tabular-nums;">12 сент <span style="opacity: 0.6; font-weight: 500;">88</span></button><button type="button" aria-pressed="false" style="height: 40px; padding: 0 14px; border-radius: 999px; background: transparent; color: #F5F3EE; border: 1px solid #3A3747; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; cursor: pointer; white-space: nowrap; font-variant-numeric: tabular-nums;">14 сент <span style="opacity: 0.6; font-weight: 500;">86</span></button><button type="button" aria-pressed="false" style="height: 40px; padding: 0 14px 0 5px; border-radius: 999px; background: transparent; color: #F5F3EE; border: 1px solid #3A3747; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; cursor: pointer; white-space: nowrap; font-variant-numeric: tabular-nums;"><span style="margin-left: 9px; display: flex;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg></span>Другая дата</button></div>
  </div>
  <span style="flex-grow: 1;"></span>
  <button type="button" style="width: 100%; height: 56px; border: none; border-radius: 999px; background: #4B5BFF; color: #FFFFFF; font-size: 16px; font-weight: 600; letter-spacing: -0.01em; cursor: pointer; box-shadow: 0 12px 32px rgba(75,91,255,0.38); font-variant-numeric: tabular-nums;">Показать 184 кадра</button>

</div>
</body>
</html>
