<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Кадров ещё нет</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&amp;family=Onest:wght@400;500;600;700&amp;display=swap">
<style>
body { margin: 0; font-family: 'Onest', ui-sans-serif, system-ui, sans-serif; background: #0B0B12; color: #F5F3EE; -webkit-font-smoothing: antialiased; overflow: hidden; }
html { overflow: hidden; }
button { font-family: inherit; }
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0B0B12; position: relative; overflow: hidden;">

  <!-- Иконки выбора в шапке нет: выбирать нечего -->
  <div style="position: absolute; left: 0; top: 0; right: 0; padding: 52px 16px 0;">
    <div style="display: flex; align-items: center; gap: 8px; height: 44px;">
      <button type="button" aria-label="Назад" style="width: 44px; height: 44px; margin-left: -10px; border: none; border-radius: 999px; background: transparent; color: #F5F3EE; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; flex-shrink: 0;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
      </button>
      <h1 style="margin: 0; flex-grow: 1; min-width: 0; font-family: 'Unbounded', sans-serif; font-weight: 600; font-size: 18px; line-height: 22px; letter-spacing: -0.03em; color: #F5F3EE; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Корпоратив Nox</h1>
    </div>

    <div role="tablist" aria-label="Что показать" style="margin-top: 12px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 999px; background: #16161F; border: 1px solid #2C2C3A;">
      <button type="button" aria-pressed="true" style="height: 36px; border: none; border-radius: 999px; background: #F5F3EE; color: #0B0B12; font-size: 14px; font-weight: 600; cursor: pointer;">Кадры</button>
      <button type="button" aria-pressed="false" style="height: 36px; border: none; border-radius: 999px; background: transparent; color: #A4A1B2; font-size: 14px; font-weight: 600; cursor: pointer;">Ролики</button>
      <button type="button" aria-pressed="false" style="height: 36px; border: none; border-radius: 999px; background: transparent; color: #A4A1B2; font-size: 14px; font-weight: 600; cursor: pointer;">Люди</button>
    </div>
  </div>

  <div style="position: absolute; left: 0; top: 168px; right: 0; bottom: 132px; padding: 0 36px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;">

    <span aria-hidden="true" style="width: 96px; height: 96px; border-radius: 999px; border: 1px dashed #35333F; background: #14141C; color: #6E6B7D; display: flex; align-items: center; justify-content: center; box-sizing: border-box;">
      <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"></rect><circle cx="8.5" cy="10" r="1.6"></circle><path d="m4 17 5-4.5 4 3.5 3-2.5 4 3.5"></path></svg>
    </span>

    <div style="display: flex; flex-direction: column; align-items: center; gap: 12px;">
      <h2 style="margin: 0; font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 24px; line-height: 28px; letter-spacing: -0.035em; color: #F5F3EE; text-align: center;">Ни одного кадра</h2>
      <p style="margin: 0; font-size: 16px; line-height: 23px; font-weight: 400; color: #A4A1B2; text-align: center; text-wrap: pretty;">Всё, что добавит любой участник, появится здесь. Начните со своих.</p>
    </div>

  </div>

  <!-- Фильтра и сортировки нет по той же причине: раскладывать нечего -->
  <div style="position: absolute; left: 16px; right: 16px; bottom: 30px;">
    <button type="button" style="width: 100%; height: 56px; border: none; border-radius: 999px; background: #4B5BFF; color: #FFFFFF; font-size: 16px; font-weight: 600; letter-spacing: -0.01em; display: flex; align-items: center; justify-content: center; gap: 9px; cursor: pointer; box-shadow: 0 12px 32px rgba(75,91,255,0.38);">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
      Добавить кадры
    </button>
  </div>

</div>
</body>
</html>
