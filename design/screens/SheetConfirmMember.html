<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Компонент: убрать участника</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&amp;family=Onest:wght@400;500;600;700&amp;display=swap">
<style>
body { margin: 0; font-family: 'Onest', ui-sans-serif, system-ui, sans-serif; background: #16161F; color: #F5F3EE; -webkit-font-smoothing: antialiased; overflow: hidden; }
html { overflow: hidden; }
button { font-family: inherit; }
</style>
</head>
<body>

<div style="width: 390px; height: 420px; box-sizing: border-box; background: #16161F; border-top: 1px solid #2C2C3A; border-radius: 28px 28px 0 0; padding: 12px 16px 30px; display: flex; flex-direction: column; gap: 18px;">
  <span style="width: 40px; height: 4px; border-radius: 999px; background: #3A3747; align-self: center;"></span>
  <div style="display: flex; align-items: center; gap: 14px;">
    <span aria-hidden="true" style="width: 64px; height: 64px; border-radius: 999px; background: #22222E; color: #F5F3EE; font-size: 18px; font-weight: 600; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">АП</span>
    <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 7px;">
      <h2 style="margin: 0; font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 21px; line-height: 24px; letter-spacing: -0.03em; color: #F5F3EE;">Убрать Аню Петрову?</h2>
      <span style="font-size: 12px; font-weight: 500; color: #A4A1B2; font-variant-numeric: tabular-nums;">@anya.p · принесла 54 кадра</span>
    </div>
  </div>
  <p style="margin: 0; font-size: 15px; line-height: 22px; font-weight: 400; color: #A4A1B2;">Всё, что этот человек сюда загрузил, уйдёт вместе с ним. Вернуть это не получится.</p>
  <div style="display: flex; align-items: center; gap: 11px; padding: 12px 14px; border-radius: 16px; background: rgba(206,48,40,0.14); border: 1px solid rgba(206,48,40,0.45);">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FF8D8D" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0;"><path d="M12 4 2.5 20h19z"></path><path d="M12 10v4M12 17h.01"></path></svg>
    <span style="font-size: 13px; font-weight: 600; color: #FF8D8D; font-variant-numeric: tabular-nums;">54 кадра исчезнут из воспоминания</span>
  </div>
  <span style="flex-grow: 1;"></span>
  <div style="display: flex; flex-direction: column; gap: 8px;">
    <button type="button" style="width: 100%; height: 56px; border: none; border-radius: 999px; background: #CE3028; color: #FFFFFF; font-size: 16px; font-weight: 600; letter-spacing: -0.01em; cursor: pointer;">Убрать</button>
    <button type="button" style="width: 100%; height: 52px; border: 1px solid #45424F; border-radius: 999px; background: transparent; color: #F5F3EE; font-size: 15px; font-weight: 600; cursor: pointer;">Оставить</button>
  </div>
</div>

</body>
</html>
