<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Отправка</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&amp;family=Onest:wght@400;500;600;700&amp;display=swap">
<style>
body { margin: 0; font-family: 'Onest', ui-sans-serif, system-ui, sans-serif; background: #0B0B12; color: #F5F3EE; -webkit-font-smoothing: antialiased; overflow: hidden; }
html { overflow: hidden; }
button { font-family: inherit; }
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0B0B12; position: relative; overflow: hidden;">

  <div style="position: absolute; left: 0; top: 0; right: 0; padding: 52px 16px 0;">
    <div style="display: flex; align-items: center; gap: 8px; height: 44px;">
      <button type="button" aria-label="Назад" style="width: 44px; height: 44px; margin-left: -10px; border: none; border-radius: 999px; background: transparent; color: #F5F3EE; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; flex-shrink: 0;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
      </button>
      <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
        <h1 style="margin: 0; font-family: 'Unbounded', sans-serif; font-weight: 600; font-size: 18px; line-height: 21px; letter-spacing: -0.03em; color: #F5F3EE;">Ваши кадры</h1>
        <span style="font-size: 12px; font-weight: 500; color: #A4A1B2; font-variant-numeric: tabular-nums;">Свадьба Лизы и Марка · 12–14 сентября</span>
      </div>
    </div>
  </div>

  <div style="position: absolute; left: 0; top: 124px; right: 0; bottom: 0; padding: 0 16px; display: flex; flex-direction: column; gap: 16px; overflow: hidden;">

    <!-- Одна полоса на всю отправку, а не тридцать четыре -->
    <div style="padding: 16px; border-radius: 20px; background: #16161F; border: 1px solid #2C2C3A; display: flex; flex-direction: column; gap: 12px;">
      <div style="display: flex; align-items: baseline; gap: 12px;">
        <span style="flex-grow: 1; font-family: 'Unbounded', sans-serif; font-size: 17px; font-weight: 600; letter-spacing: -0.02em; color: #F5F3EE;">Отправляем</span>
        <span style="font-size: 13px; font-weight: 600; color: #A4A1B2; font-variant-numeric: tabular-nums;">Осталось 9 файлов</span>
      </div>
      <div style="height: 6px; border-radius: 999px; background: #2C2C3A; overflow: hidden;">
        <div style="width: 26%; height: 100%; border-radius: 999px; background: #4B5BFF;"></div>
      </div>
      <span style="font-size: 12px; font-weight: 400; color: #6E6B7D;">Приложение можно свернуть — отправка продолжится.</span>
    </div>

    <!-- Застрявшие названы по одному: каждого можно отпустить -->
    <div style="display: flex; flex-direction: column; gap: 10px;">
      <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #A4A1B2;">Не ушли</span>

      <div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 18px; background: #16161F; border: 1px solid rgba(206,48,40,0.45);">
        <img src="../img/f08.jpg" alt="" style="width: 44px; height: 44px; object-fit: cover; border-radius: 10px; display: block; flex-shrink: 0; opacity: 0.6;">
        <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px;">
          <span style="font-size: 14px; font-weight: 600; color: #F5F3EE; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">IMG_4471.HEIC</span>
          <span style="font-size: 12px; font-weight: 500; color: #FF8D8D; font-variant-numeric: tabular-nums;">Хранилище отказало на части 3 (503)</span>
        </div>
        <button type="button" aria-label="Убрать IMG_4471.HEIC из очереди" style="width: 36px; height: 36px; border: none; border-radius: 999px; background: transparent; color: #A4A1B2; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; flex-shrink: 0;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg>
        </button>
      </div>

      <div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 18px; background: #16161F; border: 1px solid rgba(206,48,40,0.45);">
        <span style="width: 44px; height: 44px; border-radius: 10px; background: #22222E; color: #6E6B7D; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"></rect><path d="m4 17 5-4.5 4 3.5 3-2.5 4 3.5"></path></svg>
        </span>
        <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px;">
          <span style="font-size: 14px; font-weight: 600; color: #F5F3EE; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">IMG_4503.MOV</span>
          <span style="font-size: 12px; font-weight: 500; color: #FF8D8D;">Этого файла больше нет на телефоне</span>
        </div>
        <button type="button" aria-label="Убрать IMG_4503.MOV из очереди" style="width: 36px; height: 36px; border: none; border-radius: 999px; background: transparent; color: #A4A1B2; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; flex-shrink: 0;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg>
        </button>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 12px; height: 46px;">
      <span style="font-size: 13px; font-weight: 600; color: #F5F3EE;">Снято 13 сентября</span>
      <span style="flex-grow: 1; height: 1px; background: #2C2C3A;"></span>
      <button type="button" style="height: 44px; padding: 0 14px; border: 1px solid #2C2C3A; border-radius: 999px; background: transparent; color: #F5F3EE; font-size: 13px; font-weight: 600; cursor: pointer; font-variant-numeric: tabular-nums; flex-shrink: 0;">Выбрать все 61</button>
    </div>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 3px;">
      <img src="../img/f03.jpg" alt="" style="width: 100%; height: 117px; object-fit: cover; border-radius: 4px; display: block;">
      <img src="../img/f10.jpg" alt="" style="width: 100%; height: 117px; object-fit: cover; border-radius: 4px; display: block;">
      <img src="../img/f06.jpg" alt="" style="width: 100%; height: 117px; object-fit: cover; border-radius: 4px; display: block;">
    </div>

  </div>

</div>
</body>
</html>
