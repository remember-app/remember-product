<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Кадры — выбор</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&amp;family=Onest:wght@400;500;600;700&amp;display=swap">
<style>
body { margin: 0; font-family: 'Onest', ui-sans-serif, system-ui, sans-serif; background: #0B0B12; color: #F5F3EE; -webkit-font-smoothing: antialiased; overflow: hidden; }
html { overflow: hidden; }
button { font-family: inherit; }
</style>
</head>
<body>
<!-- Режим выбора в галерее: единственный способ забрать что-то домой -->
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0B0B12; position: relative; overflow: hidden;">

  <div style="position: absolute; left: 0; top: 0; right: 0; padding: 52px 16px 0;">
    <div style="display: flex; align-items: center; gap: 8px; height: 44px;">
      <button type="button" aria-label="Назад" style="width: 44px; height: 44px; margin-left: -10px; border: none; border-radius: 999px; background: transparent; color: #F5F3EE; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; flex-shrink: 0;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
      </button>
      <h1 style="margin: 0; flex-grow: 1; min-width: 0; font-family: 'Unbounded', sans-serif; font-weight: 600; font-size: 18px; line-height: 22px; letter-spacing: -0.03em; color: #F5F3EE; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Свадьба Лизы и Марка</h1>
      <button type="button" aria-label="Выйти из режима выбора" aria-pressed="true" style="width: 44px; height: 44px; margin-right: -10px; border: none; border-radius: 999px; background: #E4FF4F; color: #14160A; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; flex-shrink: 0;">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4"></rect><path d="m8 12 3 3 5-6"></path></svg>
      </button>
    </div>

    <div role="tablist" aria-label="Что показать" style="margin-top: 12px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 999px; background: #16161F; border: 1px solid #2C2C3A;">
      <button type="button" aria-pressed="true" style="height: 36px; border: none; border-radius: 999px; background: #F5F3EE; color: #0B0B12; font-size: 14px; font-weight: 600; cursor: pointer;">Кадры</button>
      <button type="button" aria-pressed="false" style="height: 36px; border: none; border-radius: 999px; background: transparent; color: #A4A1B2; font-size: 14px; font-weight: 600; cursor: pointer;">Ролики</button>
      <button type="button" aria-pressed="false" style="height: 36px; border: none; border-radius: 999px; background: transparent; color: #A4A1B2; font-size: 14px; font-weight: 600; cursor: pointer;">Люди</button>
    </div>
  </div>

  <div style="position: absolute; left: 0; top: 168px; right: 0; bottom: 0; padding: 0 16px; overflow: hidden;">

    <!-- «Выбрать все» появляется только в этом режиме и только у своего дня -->
    <div style="display: flex; align-items: center; gap: 12px; height: 56px;">
      <span style="font-size: 13px; font-weight: 600; color: #F5F3EE;">14 сентября</span>
      <span style="flex-grow: 1; height: 1px; background: #2C2C3A;"></span>
      <button type="button" style="height: 44px; padding: 0 14px; border: 1px solid #2C2C3A; border-radius: 999px; background: transparent; color: #F5F3EE; font-size: 13px; font-weight: 600; cursor: pointer; font-variant-numeric: tabular-nums; flex-shrink: 0;">Выбрать все 174</button>
    </div>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 3px;">
      <div style="position: relative;">
        <img src="../img/f03.jpg" alt="" style="width: 100%; height: 117px; object-fit: cover; border-radius: 4px; display: block;">
        <span style="position: absolute; inset: 0; border-radius: 4px; box-shadow: inset 0 0 0 3px #E4FF4F; background: rgba(11,11,18,0.28);"></span>
        <span style="position: absolute; right: 6px; top: 6px; width: 22px; height: 22px; border-radius: 999px; background: #E4FF4F; color: #14160A; display: flex; align-items: center; justify-content: center;">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg>
        </span>
      </div>
      <div style="position: relative;">
        <img src="../img/f10.jpg" alt="" style="width: 100%; height: 117px; object-fit: cover; border-radius: 4px; display: block;">
        <span style="position: absolute; right: 6px; top: 6px; width: 22px; height: 22px; border-radius: 999px; background: rgba(9,9,14,0.6); border: 1.5px solid rgba(245,243,238,0.7); box-sizing: border-box;"></span>
      </div>
      <div style="position: relative;">
        <img src="../img/f06.jpg" alt="" style="width: 100%; height: 117px; object-fit: cover; border-radius: 4px; display: block;">
        <span style="position: absolute; inset: 0; border-radius: 4px; box-shadow: inset 0 0 0 3px #E4FF4F; background: rgba(11,11,18,0.28);"></span>
        <span style="position: absolute; right: 6px; top: 6px; width: 22px; height: 22px; border-radius: 999px; background: #E4FF4F; color: #14160A; display: flex; align-items: center; justify-content: center;">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg>
        </span>
      </div>

      <div style="position: relative;">
        <img src="../img/f11.jpg" alt="" style="width: 100%; height: 117px; object-fit: cover; border-radius: 4px; display: block;">
        <span style="position: absolute; right: 6px; top: 6px; width: 22px; height: 22px; border-radius: 999px; background: rgba(9,9,14,0.6); border: 1.5px solid rgba(245,243,238,0.7); box-sizing: border-box;"></span>
      </div>
      <div style="position: relative;">
        <img src="../img/f01.jpg" alt="" style="width: 100%; height: 117px; object-fit: cover; border-radius: 4px; display: block;">
        <span style="position: absolute; right: 6px; top: 6px; width: 22px; height: 22px; border-radius: 999px; background: rgba(9,9,14,0.6); border: 1.5px solid rgba(245,243,238,0.7); box-sizing: border-box;"></span>
      </div>
      <div style="position: relative;">
        <img src="../img/f05.jpg" alt="" style="width: 100%; height: 117px; object-fit: cover; border-radius: 4px; display: block;">
        <span style="position: absolute; inset: 0; border-radius: 4px; box-shadow: inset 0 0 0 3px #E4FF4F; background: rgba(11,11,18,0.28);"></span>
        <span style="position: absolute; right: 6px; top: 6px; width: 22px; height: 22px; border-radius: 999px; background: #E4FF4F; color: #14160A; display: flex; align-items: center; justify-content: center;">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg>
        </span>
      </div>

      <div style="position: relative;">
        <img src="../img/f08.jpg" alt="" style="width: 100%; height: 117px; object-fit: cover; border-radius: 4px; display: block;">
        <span style="position: absolute; right: 6px; top: 6px; width: 22px; height: 22px; border-radius: 999px; background: rgba(9,9,14,0.6); border: 1.5px solid rgba(245,243,238,0.7); box-sizing: border-box;"></span>
      </div>
      <div style="position: relative;">
        <img src="../img/f09.jpg" alt="" style="width: 100%; height: 117px; object-fit: cover; border-radius: 4px; display: block;">
        <span style="position: absolute; right: 6px; top: 6px; width: 22px; height: 22px; border-radius: 999px; background: rgba(9,9,14,0.6); border: 1.5px solid rgba(245,243,238,0.7); box-sizing: border-box;"></span>
        <span style="position: absolute; left: 6px; bottom: 6px; display: flex; align-items: center; gap: 4px; padding: 3px 7px 3px 5px; border-radius: 999px; background: rgba(9,9,14,0.72); color: #F5F3EE; font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums;">
          <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.2v13.6L19 12z"></path></svg>
          1:08
        </span>
      </div>
      <div style="position: relative;">
        <img src="../img/f12.jpg" alt="" style="width: 100%; height: 117px; object-fit: cover; border-radius: 4px; display: block;">
        <span style="position: absolute; right: 6px; top: 6px; width: 22px; height: 22px; border-radius: 999px; background: rgba(9,9,14,0.6); border: 1.5px solid rgba(245,243,238,0.7); box-sizing: border-box;"></span>
      </div>
    </div>

  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 176px; background: linear-gradient(to top, #0B0B12 62%, rgba(11,11,18,0) 100%); pointer-events: none;"></div>
  <div style="position: absolute; left: 16px; right: 16px; bottom: 30px; display: flex; flex-direction: column; gap: 12px;">
    <div style="display: flex; align-items: center; gap: 12px;">
      <span style="flex-grow: 1; font-size: 13px; font-weight: 600; color: #F5F3EE; font-variant-numeric: tabular-nums;">Выбрано 3</span>
      <button type="button" style="height: 44px; padding: 0 14px; margin-right: -14px; border: none; border-radius: 999px; background: transparent; color: #A4A1B2; font-size: 14px; font-weight: 600; cursor: pointer;">Снять</button>
    </div>
    <button type="button" style="width: 100%; height: 56px; border: none; border-radius: 999px; background: #4B5BFF; color: #FFFFFF; font-size: 16px; font-weight: 600; letter-spacing: -0.01em; display: flex; align-items: center; justify-content: center; gap: 9px; cursor: pointer; box-shadow: 0 12px 32px rgba(75,91,255,0.38); font-variant-numeric: tabular-nums;">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><path d="m7 10 5 5 5-5"></path><path d="M12 15V3"></path></svg>
      Скачать 3 файла
    </button>
  </div>

</div>
</body>
</html>
