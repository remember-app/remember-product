<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Воспоминание — ролики</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&amp;family=Onest:wght@400;500;600;700&amp;display=swap">
<style>
body { margin: 0; font-family: 'Onest', ui-sans-serif, system-ui, sans-serif; background: #0B0B12; color: #F5F3EE; -webkit-font-smoothing: antialiased; overflow: hidden; }
html { overflow: hidden; }
a { color: inherit; text-decoration: none; }
button { font-family: inherit; }
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0B0B12; position: relative; overflow: hidden;">

  <div style="position: absolute; left: 0; top: 0; right: 0; padding: 52px 16px 0;">
    <div style="display: flex; align-items: center; gap: 8px; height: 44px;">
      <button type="button" aria-label="Назад" style="width: 44px; height: 44px; margin-left: -10px; border: none; border-radius: 999px; background: transparent; color: #F5F3EE; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; flex-shrink: 0;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
      </button>
      <h1 style="margin: 0; flex-grow: 1; min-width: 0; font-family: 'Unbounded', sans-serif; font-weight: 600; font-size: 18px; line-height: 22px; letter-spacing: -0.03em; color: #F5F3EE; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Свадьба Лизы и Марка</h1>
    </div>

    <div role="tablist" aria-label="Что показать" style="margin-top: 12px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 999px; background: #16161F; border: 1px solid #2C2C3A;">
      <button type="button" aria-pressed="false" style="height: 36px; border: none; border-radius: 999px; background: transparent; color: #A4A1B2; font-size: 14px; font-weight: 600; cursor: pointer;">Кадры</button>
      <button type="button" aria-pressed="true" style="height: 36px; border: none; border-radius: 999px; background: #F5F3EE; color: #0B0B12; font-size: 14px; font-weight: 600; cursor: pointer;">Ролики</button>
      <button type="button" aria-pressed="false" style="height: 36px; border: none; border-radius: 999px; background: transparent; color: #A4A1B2; font-size: 14px; font-weight: 600; cursor: pointer;">Люди</button>
    </div>
  </div>

  <div style="position: absolute; left: 0; top: 168px; right: 0; bottom: 0; padding: 0 16px; display: flex; flex-direction: column; gap: 12px; overflow: hidden;">

    <!-- Готовый ролик: постер, который и есть кнопка -->
    <div style="background: #16161F; border: 1px solid #2C2C3A; border-radius: 22px; overflow: hidden; flex-shrink: 0;">
      <a href="#watch" aria-label="Смотреть: Ролик на 1:00" style="display: block; position: relative; height: 200px;">
        <img src="../img/f01.jpg" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block;">
        <span style="position: absolute; inset: 0; background: rgba(9,9,14,0.28);"></span>
        <span style="position: absolute; left: 50%; top: 50%; width: 62px; height: 62px; margin: -31px 0 0 -31px; border-radius: 999px; background: rgba(245,243,238,0.95); color: #0B0B12; display: flex; align-items: center; justify-content: center;">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.2v13.6L19 12z"></path></svg>
        </span>
        <span style="position: absolute; right: 12px; bottom: 12px; padding: 4px 9px; border-radius: 999px; background: rgba(9,9,14,0.72); color: #F5F3EE; font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums;">1:00</span>
      </a>
      <div style="padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 12px;">
        <div style="display: flex; align-items: flex-start; gap: 12px;">
          <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 6px;">
            <h2 style="margin: 0; font-family: 'Unbounded', sans-serif; font-weight: 600; font-size: 19px; line-height: 22px; letter-spacing: -0.025em; color: #F5F3EE;">Ролик на 1:00</h2>
            <div style="font-size: 12px; font-weight: 500; color: #A4A1B2; font-variant-numeric: tabular-nums;">14 сентября · горизонтальный · Тёплая</div>
          </div>
          <span style="padding: 6px 11px; border-radius: 999px; background: #E4FF4F; color: #14160A; font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; flex-shrink: 0;">Готов</span>
        </div>
        <button type="button" style="height: 44px; border: 1px solid #45424F; border-radius: 999px; background: transparent; color: #F5F3EE; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer;">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><path d="m7 10 5 5 5-5"></path><path d="M12 15V3"></path></svg>
          Сохранить и поделиться
        </button>
      </div>
    </div>

    <!-- Собирается: не проценты, а этап — понятно, что именно сейчас делают -->
    <a href="MontageProgress.html" style="display: block; background: #16161F; border: 1px solid #2C2C3A; border-radius: 22px; padding: 16px; flex-shrink: 0;">
      <div style="display: flex; align-items: flex-start; gap: 12px;">
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 6px;">
          <h2 style="margin: 0; font-family: 'Unbounded', sans-serif; font-weight: 600; font-size: 19px; line-height: 22px; letter-spacing: -0.025em; color: #F5F3EE;">Ролик на 2:00</h2>
          <div style="font-size: 13px; font-weight: 500; color: #A4A1B2;">Мы сообщим, когда будет готов</div>
        </div>
        <span style="padding: 6px 11px; border-radius: 999px; background: rgba(75,91,255,0.20); color: #A7AEFF; font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; flex-shrink: 0;">Собирается</span>
      </div>
      <div style="margin-top: 14px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px;">
        <span style="height: 3px; border-radius: 999px; background: #E4FF4F;"></span>
        <span style="height: 3px; border-radius: 999px; background: #E4FF4F;"></span>
        <span style="height: 3px; border-radius: 999px; background: #4B5BFF;"></span>
        <span style="height: 3px; border-radius: 999px; background: #2C2C3A;"></span>
        <span style="height: 3px; border-radius: 999px; background: #2C2C3A;"></span>
      </div>
      <div style="margin-top: 9px; display: flex; align-items: center; gap: 10px;">
        <span aria-hidden="true" style="width: 16px; height: 16px; border-radius: 999px; border: 2px solid #2C2C3A; border-top-color: #4B5BFF; box-sizing: border-box; flex-shrink: 0;"></span>
        <span style="flex-grow: 1; font-size: 12px; font-weight: 600; color: #F5F3EE;">Режиссёр строит историю</span>
        <span style="font-size: 12px; font-weight: 500; color: #6E6B7D; font-variant-numeric: tabular-nums;">3 из 5</span>
      </div>
    </a>

    <!-- Упавшая сборка: организатор запускает заново -->
    <div style="background: #16161F; border: 1px solid rgba(255,90,90,0.38); border-radius: 22px; padding: 16px; display: flex; flex-direction: column; gap: 12px; flex-shrink: 0;">
      <div style="display: flex; align-items: flex-start; gap: 12px;">
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 6px;">
          <h2 style="margin: 0; font-family: 'Unbounded', sans-serif; font-weight: 600; font-size: 19px; line-height: 22px; letter-spacing: -0.025em; color: #F5F3EE;">Ролик от 12 сентября</h2>
          <div style="font-size: 13px; font-weight: 500; color: #FF8D8D;">Сборка оборвалась на полпути</div>
        </div>
        <span style="padding: 6px 11px; border-radius: 999px; background: rgba(255,90,90,0.16); color: #FF8D8D; font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; flex-shrink: 0;">Не собрался</span>
      </div>
      <button type="button" style="height: 44px; border: 1px solid #45424F; border-radius: 999px; background: transparent; color: #F5F3EE; font-size: 14px; font-weight: 600; cursor: pointer;">Повторить</button>
    </div>

  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 132px; background: linear-gradient(to top, #0B0B12 58%, rgba(11,11,18,0) 100%); pointer-events: none;"></div>
  <div style="position: absolute; left: 16px; right: 16px; bottom: 30px;">
    <button type="button" style="width: 100%; height: 56px; border: none; border-radius: 999px; background: #4B5BFF; color: #FFFFFF; font-size: 16px; font-weight: 600; letter-spacing: -0.01em; display: flex; align-items: center; justify-content: center; gap: 9px; cursor: pointer; box-shadow: 0 12px 32px rgba(75,91,255,0.38);">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16v16H4z"></path><path d="M4 9h16M9 4v16"></path></svg>
      Смонтировать ролик
    </button>
  </div>

</div>
</body>
</html>
