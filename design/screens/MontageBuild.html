<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Ролик — как собрать</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&amp;family=Onest:wght@400;500;600;700&amp;display=swap">
<style>
body { margin: 0; font-family: 'Onest', ui-sans-serif, system-ui, sans-serif; background: #0B0B12; color: #F5F3EE; -webkit-font-smoothing: antialiased; overflow: hidden; }
html { overflow: hidden; }
a { color: inherit; text-decoration: none; }
button { font-family: inherit; }
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0B0B12; position: relative; overflow: hidden;">

  <div style="position: absolute; left: 0; top: 0; right: 0; padding: 52px 16px 0;">
    <div style="display: flex; align-items: center; height: 44px;">
      <div style="width: 74px; display: flex;">
        <button type="button" aria-label="Назад" style="width: 44px; height: 44px; margin-left: -10px; border: none; border-radius: 999px; background: transparent; color: #F5F3EE; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
        </button>
      </div>
      <span style="flex-grow: 1; text-align: center; font-size: 13px; font-weight: 600; color: #A4A1B2; font-variant-numeric: tabular-nums;">Шаг 4 из 4</span>
      <div style="width: 74px; display: flex; justify-content: flex-end;">
        <button type="button" style="height: 44px; padding: 0 10px; margin-right: -10px; border: none; background: transparent; color: #A4A1B2; font-size: 14px; font-weight: 600; cursor: pointer;">Отмена</button>
      </div>
    </div>

    <div style="margin-top: 12px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px;">
      <span style="height: 3px; border-radius: 999px; background: #4B5BFF;"></span>
      <span style="height: 3px; border-radius: 999px; background: #4B5BFF;"></span>
      <span style="height: 3px; border-radius: 999px; background: #4B5BFF;"></span>
      <span style="height: 3px; border-radius: 999px; background: #4B5BFF;"></span>
    </div>

    <h1 style="margin: 18px 0 0; font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 26px; line-height: 29px; letter-spacing: -0.035em; color: #F5F3EE;">Как собрать</h1>
  </div>

  <div style="position: absolute; left: 0; top: 190px; right: 0; bottom: 0; padding: 0 16px; display: flex; flex-direction: column; gap: 20px; overflow: hidden;">

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #A4A1B2;">Длина</span>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 999px; background: #16161F; border: 1px solid #2C2C3A;">
        <button type="button" aria-pressed="false" style="height: 40px; border: none; border-radius: 999px; background: transparent; color: #A4A1B2; font-size: 14px; font-weight: 600; cursor: pointer;">Полминуты</button>
        <button type="button" aria-pressed="true" style="height: 40px; border: none; border-radius: 999px; background: #F5F3EE; color: #0B0B12; font-size: 14px; font-weight: 600; cursor: pointer;">Минута</button>
        <button type="button" aria-pressed="false" style="height: 40px; border: none; border-radius: 999px; background: transparent; color: #A4A1B2; font-size: 14px; font-weight: 600; cursor: pointer;">Две минуты</button>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #A4A1B2;">Формат</span>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 999px; background: #16161F; border: 1px solid #2C2C3A;">
        <button type="button" aria-pressed="true" style="height: 40px; border: none; border-radius: 999px; background: #F5F3EE; color: #0B0B12; font-size: 14px; font-weight: 600; cursor: pointer;">Горизонтальный</button>
        <button type="button" aria-pressed="false" style="height: 40px; border: none; border-radius: 999px; background: transparent; color: #A4A1B2; font-size: 14px; font-weight: 600; cursor: pointer;">Вертикальный</button>
      </div>
    </div>

    <!-- Сводка заказа: каждая строка ведёт обратно на свой шаг -->
    <div style="border-radius: 20px; background: #16161F; border: 1px solid #2C2C3A; overflow: hidden;">
      <a href="MontageSelect.html" style="display: flex; align-items: center; gap: 12px; padding: 15px 16px;">
        <span style="width: 88px; flex-shrink: 0; font-size: 13px; font-weight: 500; color: #A4A1B2;">Кадры</span>
        <span style="flex-grow: 1; min-width: 0; font-size: 14px; font-weight: 600; color: #F5F3EE; font-variant-numeric: tabular-nums;">214 из 486</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6E6B7D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0;"><path d="m9 18 6-6-6-6"></path></svg>
      </a>
      <div style="height: 1px; background: #2C2C3A;"></div>
      <a href="MontageStory.html" style="display: flex; align-items: center; gap: 12px; padding: 15px 16px;">
        <span style="width: 88px; flex-shrink: 0; font-size: 13px; font-weight: 500; color: #A4A1B2;">История</span>
        <span style="flex-grow: 1; min-width: 0; font-size: 14px; font-weight: 600; color: #F5F3EE; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Сборы, церемония, танцы…</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6E6B7D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0;"><path d="m9 18 6-6-6-6"></path></svg>
      </a>
      <div style="height: 1px; background: #2C2C3A;"></div>
      <a href="MontageMusic.html" style="display: flex; align-items: center; gap: 12px; padding: 15px 16px;">
        <span style="width: 88px; flex-shrink: 0; font-size: 13px; font-weight: 500; color: #A4A1B2;">Музыка</span>
        <span style="flex-grow: 1; min-width: 0; font-size: 14px; font-weight: 600; color: #F5F3EE;">Яркая · в ритм</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6E6B7D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0;"><path d="m9 18 6-6-6-6"></path></svg>
      </a>
    </div>

    <!-- Сказано до нажатия, а не после -->
    <div style="display: flex; align-items: flex-start; gap: 11px; padding: 0 4px;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#6E6B7D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 2px;"><circle cx="12" cy="12" r="9"></circle><path d="M12 8h.01M11 12h1v4h1"></path></svg>
      <span style="font-size: 12px; line-height: 18px; font-weight: 400; color: #6E6B7D;">Готовый ролик не переделывается. Если захотите иначе — соберёте ещё один, их число не ограничено.</span>
    </div>

  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 132px; background: linear-gradient(to top, #0B0B12 58%, rgba(11,11,18,0) 100%); pointer-events: none;"></div>
  <div style="position: absolute; left: 16px; right: 16px; bottom: 30px;">
    <button type="button" style="width: 100%; height: 56px; border: none; border-radius: 999px; background: #4B5BFF; color: #FFFFFF; font-size: 16px; font-weight: 600; letter-spacing: -0.01em; display: flex; align-items: center; justify-content: center; gap: 9px; cursor: pointer; box-shadow: 0 12px 32px rgba(75,91,255,0.38);">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16v16H4z"></path><path d="M4 9h16M9 4v16"></path></svg>
      Смонтировать
    </button>
  </div>

</div>
</body>
</html>
