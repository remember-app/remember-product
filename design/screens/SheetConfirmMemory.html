<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Компонент: удалить воспоминание</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&amp;family=Onest:wght@400;500;600;700&amp;display=swap">
<style>
body { margin: 0; font-family: 'Onest', ui-sans-serif, system-ui, sans-serif; background: #16161F; color: #F5F3EE; -webkit-font-smoothing: antialiased; overflow: hidden; }
html { overflow: hidden; }
button { font-family: inherit; }
</style>
</head>
<body>

<div style="width: 390px; height: 430px; box-sizing: border-box; background: #16161F; border-top: 1px solid #2C2C3A; border-radius: 28px 28px 0 0; padding: 12px 16px 30px; display: flex; flex-direction: column; gap: 18px;">
  <span style="width: 40px; height: 4px; border-radius: 999px; background: #3A3747; align-self: center;"></span>
  <div style="display: flex; align-items: center; gap: 14px;">
    <img src="../img/f01.jpg" alt="" style="width: 64px; height: 64px; object-fit: cover; border-radius: 14px; display: block; flex-shrink: 0;">
    <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 7px;">
      <h2 style="margin: 0; font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 21px; line-height: 24px; letter-spacing: -0.03em; color: #F5F3EE;">Удалить воспоминание?</h2>
      <span style="font-size: 12px; font-weight: 500; color: #A4A1B2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums;">Свадьба Лизы и Марка · 486 кадров</span>
    </div>
  </div>
  <p style="margin: 0; font-size: 15px; line-height: 22px; font-weight: 400; color: #A4A1B2; text-wrap: pretty;">Оно исчезнет у всех шести участников — кадры, ролики и журналы монтажа. Вернуть будет нельзя.</p>
  <div style="display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 18px; background: #0B0B12; border: 1px solid #2C2C3A;">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FF8D8D" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0;"><path d="M12 9v4"></path><path d="M12 17h.01"></path><path d="M10.3 3.9 2.4 18a2 2 0 0 0 1.7 3h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"></path></svg>
    <span style="font-size: 13px; line-height: 18px; font-weight: 500; color: #FF8D8D; text-wrap: pretty;">358 кадров сюда принесли другие</span>
  </div>
  <span style="flex-grow: 1;"></span>
  <div style="display: flex; flex-direction: column; gap: 8px;">
    <button type="button" style="width: 100%; height: 56px; border: none; border-radius: 999px; background: #CE3028; color: #FFFFFF; font-size: 16px; font-weight: 600; letter-spacing: -0.01em; cursor: pointer;">Удалить навсегда</button>
    <button type="button" style="width: 100%; height: 52px; border: 1px solid #45424F; border-radius: 999px; background: transparent; color: #F5F3EE; font-size: 15px; font-weight: 600; cursor: pointer;">Оставить</button>
  </div>
</div>

</body>
</html>
