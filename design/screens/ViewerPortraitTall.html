<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Кадр — телефон вертикально, кадр вертикальный</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&amp;family=Onest:wght@400;500;600;700&amp;display=swap">
<style>
body { margin: 0; font-family: 'Onest', ui-sans-serif, system-ui, sans-serif; background: #08080C; color: #F5F3EE; -webkit-font-smoothing: antialiased; overflow: hidden; }
html { overflow: hidden; }
button { font-family: inherit; }
</style>
</head>
<body>

<!-- Телефон вертикально, кадр вертикальный 3:4 — самый частый случай. Кадр во всю ширину, поля сверху и снизу небольшие -->
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #08080C; position: relative; overflow: hidden;">

  <!-- Кадр вписан в экран целиком и не обрезан: упирается в ширину, а сверху и снизу остаётся чёрное поле -->
  <div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;">
    <div style="width: 390px; height: 520px; overflow: hidden;">
      <img src="../img/f10.jpg" alt="Фото, 13 сентября" style="width: 100%; height: 100%; object-fit: cover; display: block;">
    </div>
  </div>

  <div style="position: absolute; left: 0; top: 0; right: 0; height: 150px; background: linear-gradient(to bottom, rgba(8,8,12,0.72) 0%, rgba(8,8,12,0) 100%); pointer-events: none;"></div>
  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 160px; background: linear-gradient(to top, rgba(8,8,12,0.82) 0%, rgba(8,8,12,0) 100%); pointer-events: none;"></div>

  <!-- Управление лежит поверх кадра: назад, сведения по центру, действия справа -->
  <div style="position: absolute; left: 0; top: 52px; right: 0; padding: 0 12px; display: flex; align-items: center; gap: 10px;">
    <button type="button" aria-label="Закрыть" style="width: 48px; height: 48px; border: 1px solid rgba(255,255,255,0.09); box-sizing: border-box; border-radius: 999px; background: rgba(22,22,31,0.62); backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px); color: #F5F3EE; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; flex-shrink: 0;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
    </button>
    <div style="flex-grow: 1; display: flex; justify-content: center; min-width: 0;">
      <button type="button" aria-label="Сведения о кадре: 13 сентября, 21:47 · Марк Ковалёв" style="max-width: 100%; height: 48px; padding: 0 20px; border: 1px solid rgba(255,255,255,0.09); box-sizing: border-box; border-radius: 999px; background: rgba(22,22,31,0.62); backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px); color: #F5F3EE; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; cursor: pointer;">
        <span style="font-size: 15px; font-weight: 600; color: #F5F3EE;">13 сентября</span>
        <span style="font-size: 12px; font-weight: 500; color: rgba(245,243,238,0.66); font-variant-numeric: tabular-nums;">21:47 · Марк Ковалёв</span>
      </button>
    </div>
    <button type="button" aria-label="Действия: поделиться, сохранить, удалить" style="width: 48px; height: 48px; border: 1px solid rgba(255,255,255,0.09); box-sizing: border-box; border-radius: 999px; background: rgba(22,22,31,0.62); backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px); color: #F5F3EE; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; flex-shrink: 0;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.9"></circle><circle cx="12" cy="12" r="1.9"></circle><circle cx="19" cy="12" r="1.9"></circle></svg>
    </button>
  </div>

  <!-- Плёнка: текущий кадр выше и ярче соседей -->
  <div style="position: absolute; left: 0; right: 0; bottom: 30px; display: flex; align-items: center; justify-content: center; gap: 2px; height: 48px; padding: 0 8px;"><img src="../img/f12.jpg" alt="" style="width: 30px; height: 44px; object-fit: cover; border-radius: 3px; display: block; opacity: 0.45; flex-shrink: 0;"><img src="../img/f03.jpg" alt="" style="width: 30px; height: 44px; object-fit: cover; border-radius: 3px; display: block; opacity: 0.45; flex-shrink: 0;"><img src="../img/f06.jpg" alt="" style="width: 30px; height: 44px; object-fit: cover; border-radius: 3px; display: block; opacity: 0.6; flex-shrink: 0;"><img src="../img/f01.jpg" alt="" style="width: 30px; height: 44px; object-fit: cover; border-radius: 3px; display: block; opacity: 0.75; flex-shrink: 0;"><img src="../img/f05.jpg" alt="" style="width: 44px; height: 48px; object-fit: cover; border-radius: 5px; display: block; flex-shrink: 0;"><img src="../img/f11.jpg" alt="" style="width: 30px; height: 44px; object-fit: cover; border-radius: 3px; display: block; opacity: 0.75; flex-shrink: 0;"><img src="../img/f09.jpg" alt="" style="width: 30px; height: 44px; object-fit: cover; border-radius: 3px; display: block; opacity: 0.6; flex-shrink: 0;"><img src="../img/f05.jpg" alt="" style="width: 30px; height: 44px; object-fit: cover; border-radius: 3px; display: block; opacity: 0.45; flex-shrink: 0;"><img src="../img/f08.jpg" alt="" style="width: 30px; height: 44px; object-fit: cover; border-radius: 3px; display: block; opacity: 0.45; flex-shrink: 0;"><img src="../img/f04.jpg" alt="" style="width: 30px; height: 44px; object-fit: cover; border-radius: 3px; display: block; opacity: 0.45; flex-shrink: 0;"><img src="../img/f10.jpg" alt="" style="width: 30px; height: 44px; object-fit: cover; border-radius: 3px; display: block; opacity: 0.45; flex-shrink: 0;"></div>

</div>
</body>
</html>
