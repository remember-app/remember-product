<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Компонент: удалить кадр</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&amp;family=Onest:wght@400;500;600;700&amp;display=swap">
<style>
body { margin: 0; font-family: 'Onest', ui-sans-serif, system-ui, sans-serif; background: #16161F; color: #F5F3EE; -webkit-font-smoothing: antialiased; overflow: hidden; }
html { overflow: hidden; }
button { font-family: inherit; }
</style>
</head>
<body>
<!-- Лист подтверждения: единственный вид, в котором продукт говорит «навсегда» -->
<div style="width: 390px; height: 380px; box-sizing: border-box; background: #16161F; border-top: 1px solid #2C2C3A; border-radius: 28px 28px 0 0; padding: 12px 16px 30px; display: flex; flex-direction: column; gap: 18px;">

  <span style="width: 40px; height: 4px; border-radius: 999px; background: #3A3747; align-self: center;"></span>

  <div style="display: flex; align-items: center; gap: 14px;">
    <img src="../img/f10.jpg" alt="" style="width: 64px; height: 64px; object-fit: cover; border-radius: 14px; display: block; flex-shrink: 0;">
    <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 7px;">
      <h2 style="margin: 0; font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 21px; line-height: 24px; letter-spacing: -0.03em; color: #F5F3EE;">Удалить это фото?</h2>
      <span style="font-size: 12px; font-weight: 500; color: #A4A1B2; font-variant-numeric: tabular-nums;">Марк Ковалёв · 13 сентября</span>
    </div>
  </div>

  <p style="margin: 0; font-size: 15px; line-height: 22px; font-weight: 400; color: #A4A1B2;">Оно уйдёт из воспоминания навсегда. В уже собранном ролике останется.</p>

  <span style="flex-grow: 1;"></span>

  <div style="display: flex; flex-direction: column; gap: 8px;">
    <button type="button" style="width: 100%; height: 56px; border: none; border-radius: 999px; background: #CE3028; color: #FFFFFF; font-size: 16px; font-weight: 600; letter-spacing: -0.01em; cursor: pointer;">Удалить</button>
    <button type="button" style="width: 100%; height: 52px; border: 1px solid #45424F; border-radius: 999px; background: transparent; color: #F5F3EE; font-size: 15px; font-weight: 600; cursor: pointer;">Оставить</button>
  </div>

</div>
</body>
</html>
