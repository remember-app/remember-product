<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Новое воспоминание</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&amp;family=Onest:wght@400;500;600;700&amp;display=swap">
<style>
body { margin: 0; font-family: 'Onest', ui-sans-serif, system-ui, sans-serif; background: #0B0B12; color: #F5F3EE; -webkit-font-smoothing: antialiased; overflow: hidden; }
html { overflow: hidden; }
button { font-family: inherit; }
input { font-family: inherit; }
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0B0B12; position: relative; overflow: hidden;">

  <div style="position: absolute; left: 0; top: 0; right: 0; padding: 52px 16px 0;">
    <div style="display: flex; align-items: center; gap: 8px; height: 44px;">
      <button type="button" aria-label="Назад" style="width: 44px; height: 44px; margin-left: -10px; border: none; border-radius: 999px; background: transparent; color: #F5F3EE; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; flex-shrink: 0;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
      </button>
      <h1 style="margin: 0; flex-grow: 1; font-family: 'Unbounded', sans-serif; font-weight: 600; font-size: 18px; line-height: 22px; letter-spacing: -0.03em; color: #F5F3EE;">Новое воспоминание</h1>
    </div>
  </div>

  <div style="position: absolute; left: 0; top: 124px; right: 0; bottom: 0; padding: 0 16px; display: flex; flex-direction: column; gap: 22px; overflow: hidden;">

    <div style="display: flex; flex-direction: column; gap: 9px;">
      <label for="title" style="font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #A4A1B2;">Название</label>
      <input id="title" type="text" value="Свадьба Лизы и Марка" placeholder="День рождения Анны" style="height: 56px; box-sizing: border-box; border-radius: 18px; background: #16161F; border: 1px solid #2C2C3A; outline: none; color: #F5F3EE; font-family: 'Unbounded', sans-serif; font-size: 17px; font-weight: 600; letter-spacing: -0.02em; padding: 0 16px;">
    </div>

    <div style="display: flex; flex-direction: column; gap: 9px;">
      <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #A4A1B2;">Дата события</span>
      <button type="button" style="height: 56px; border-radius: 18px; background: #16161F; border: 1px solid #2C2C3A; color: #F5F3EE; font-size: 16px; font-weight: 500; display: flex; align-items: center; gap: 12px; padding: 0 16px; cursor: pointer; font-variant-numeric: tabular-nums;">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#A4A1B2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0;"><rect x="3" y="5" width="18" height="16" rx="3"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>
        <span style="flex-grow: 1; text-align: left;">12 сентября 2026</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6E6B7D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0;"><path d="m6 9 6 6 6-6"></path></svg>
      </button>
      <span style="font-size: 12px; font-weight: 400; line-height: 17px; color: #A4A1B2;">Приложение найдёт по этим датам снятое на телефоне.</span>
    </div>

    <div style="display: flex; align-items: center; gap: 12px;">
      <span style="flex-grow: 1; font-size: 15px; font-weight: 500; color: #F5F3EE;">Длилось больше дня</span>
      <button type="button" role="switch" aria-checked="true" aria-label="Длилось больше дня" style="width: 52px; height: 32px; padding: 3px; border: none; border-radius: 999px; background: #4B5BFF; display: flex; justify-content: flex-end; align-items: center; cursor: pointer; flex-shrink: 0;">
        <span style="width: 26px; height: 26px; border-radius: 999px; background: #FFFFFF; display: block;"></span>
      </button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 9px;">
      <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #A4A1B2;">Заканчивается</span>
      <button type="button" style="height: 56px; border-radius: 18px; background: #16161F; border: 1px solid #2C2C3A; color: #F5F3EE; font-size: 16px; font-weight: 500; display: flex; align-items: center; gap: 12px; padding: 0 16px; cursor: pointer; font-variant-numeric: tabular-nums;">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#A4A1B2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0;"><rect x="3" y="5" width="18" height="16" rx="3"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>
        <span style="flex-grow: 1; text-align: left;">14 сентября 2026</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6E6B7D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0;"><path d="m6 9 6 6 6-6"></path></svg>
      </button>
    </div>

    <!-- Отвечает на вопрос, который экран не задаёт: где все остальные -->
    <div style="display: flex; align-items: flex-start; gap: 11px; padding: 14px 16px; border-radius: 18px; background: #16161F; border: 1px solid #2C2C3A;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#E4FF4F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px;"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M19 8v6M22 11h-6"></path></svg>
      <span style="font-size: 13px; line-height: 19px; font-weight: 500; color: #A4A1B2;">Позвать участников можно сразу после создания.</span>
    </div>

  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 132px; background: linear-gradient(to top, #0B0B12 58%, rgba(11,11,18,0) 100%); pointer-events: none;"></div>
  <div style="position: absolute; left: 16px; right: 16px; bottom: 30px;">
    <button type="button" style="width: 100%; height: 56px; border: none; border-radius: 999px; background: #4B5BFF; color: #FFFFFF; font-size: 16px; font-weight: 600; letter-spacing: -0.01em; cursor: pointer; box-shadow: 0 12px 32px rgba(75,91,255,0.38);">Создать</button>
  </div>

</div>
</body>
</html>
