<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Компонент: это всё?</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&amp;family=Onest:wght@400;500;600;700&amp;display=swap">
<style>
body { margin: 0; font-family: 'Onest', ui-sans-serif, system-ui, sans-serif; background: #16161F; color: #F5F3EE; -webkit-font-smoothing: antialiased; overflow: hidden; }
html { overflow: hidden; }
button { font-family: inherit; }
</style>
</head>
<body>
<!-- Спрашиваем один раз, после отправки: этим человек сам ставит себе статус (doc-06) -->
<div style="width: 390px; height: 420px; box-sizing: border-box; background: #16161F; border-top: 1px solid #2C2C3A; border-radius: 28px 28px 0 0; padding: 12px 16px 30px; display: flex; flex-direction: column; gap: 18px;">

  <span style="width: 40px; height: 4px; border-radius: 999px; background: #3A3747; align-self: center;"></span>

  <div style="display: flex; align-items: center; gap: 12px;">
    <span aria-hidden="true" style="width: 26px; height: 26px; border-radius: 999px; background: #E4FF4F; color: #14160A; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg>
    </span>
    <span style="font-size: 14px; font-weight: 600; color: #F5F3EE; font-variant-numeric: tabular-nums;">12 файлов ушли в воспоминание</span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px;">
    <h2 style="margin: 0; font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 23px; line-height: 26px; letter-spacing: -0.03em; color: #F5F3EE;">Это всё?</h2>
    <p style="margin: 0; font-size: 15px; line-height: 22px; font-weight: 400; color: #A4A1B2;">Или что-то ещё осталось? Организатор увидит ваш ответ и поймёт, ждать вас или нет.</p>
  </div>

  <span style="flex-grow: 1;"></span>

  <!-- Оба ответа равны по весу: это слово человека, а не то, что от него нужно -->
  <div style="display: flex; flex-direction: column; gap: 8px;">
    <button type="button" style="width: 100%; height: 56px; border: none; border-radius: 999px; background: #F5F3EE; color: #0B0B12; font-size: 16px; font-weight: 600; letter-spacing: -0.01em; cursor: pointer;">Больше ничего</button>
    <button type="button" style="width: 100%; height: 56px; border: 1px solid #45424F; border-radius: 999px; background: transparent; color: #F5F3EE; font-size: 16px; font-weight: 600; letter-spacing: -0.01em; cursor: pointer;">Ещё будет</button>
  </div>

</div>
</body>
</html>
