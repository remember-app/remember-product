<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Придумайте ник</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&amp;family=Onest:wght@400;500;600;700&amp;display=swap">
<style>
body { margin: 0; font-family: 'Onest', ui-sans-serif, system-ui, sans-serif; background: #0B0B12; color: #F5F3EE; -webkit-font-smoothing: antialiased; overflow: hidden; }
html { overflow: hidden; }
button { font-family: inherit; }
input { font-family: inherit; }
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0B0B12; position: relative; overflow: hidden;">

  <!-- Та же шапка, что на входе: человек не переехал, он всё ещё заходит -->
  <div style="position: absolute; left: 0; top: 68px; right: 0; height: 236px; overflow: hidden;">
    <img src="../img/f05.jpg" alt="" style="position: absolute; left: 24px; top: 30px; width: 144px; height: 178px; object-fit: cover; border-radius: 18px; transform: rotate(-9deg); box-shadow: 0 18px 40px rgba(0,0,0,0.55);">
    <img src="../img/f09.jpg" alt="" style="position: absolute; right: 24px; top: 22px; width: 144px; height: 178px; object-fit: cover; border-radius: 18px; transform: rotate(8deg); box-shadow: 0 18px 40px rgba(0,0,0,0.55);">
    <img src="../img/f10.jpg" alt="" style="position: absolute; left: 50%; margin-left: -84px; top: 40px; width: 168px; height: 196px; object-fit: cover; border-radius: 20px; transform: rotate(-1.5deg); box-shadow: 0 22px 50px rgba(0,0,0,0.65);">
  </div>

  <div style="position: absolute; left: 0; top: 330px; right: 0; padding: 0 24px; display: flex; flex-direction: column; align-items: center; gap: 14px;">
    <h1 style="margin: 0; font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 42px; line-height: 44px; letter-spacing: -0.045em; color: #F5F3EE; text-align: center;">Remember</h1>
    <p style="margin: 0; font-size: 16px; line-height: 23px; font-weight: 400; color: #A4A1B2; text-align: center; text-wrap: pretty;">После события кадры расходятся по десяти телефонам. Здесь они сходятся обратно — и становятся роликом.</p>
  </div>

  <!-- Последний шаг: ник набирается тем же шрифтом, что заголовки — он и есть имя -->
  <div style="position: absolute; left: 16px; right: 16px; bottom: 34px; display: flex; flex-direction: column; gap: 12px;">
    <label for="nick" style="font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #A4A1B2; padding-left: 4px;">Ник</label>
    <div style="height: 60px; border-radius: 20px; background: #16161F; border: 1px solid #E4FF4F; display: flex; align-items: center; gap: 4px; padding: 0 18px; box-sizing: border-box;">
      <span style="font-family: 'Unbounded', sans-serif; font-size: 19px; font-weight: 600; color: #6E6B7D;">@</span>
      <input id="nick" type="text" value="liza" placeholder="ник" autocomplete="off" autocapitalize="none" style="flex-grow: 1; min-width: 0; background: transparent; border: none; outline: none; color: #F5F3EE; font-family: 'Unbounded', sans-serif; font-size: 19px; font-weight: 600; letter-spacing: -0.02em; padding: 0;">
      <span aria-hidden="true" style="width: 22px; height: 22px; border-radius: 999px; background: #E4FF4F; color: #14160A; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg>
      </span>
    </div>

    <div style="display: flex; align-items: baseline; gap: 8px; padding-left: 4px;">
      <span style="font-size: 13px; font-weight: 600; color: #E4FF4F;">Ник свободен.</span>
      <span style="font-size: 13px; font-weight: 400; color: #A4A1B2;">По нему вас найдут в воспоминании.</span>
    </div>

    <button type="button" style="width: 100%; height: 56px; border: none; border-radius: 999px; background: #4B5BFF; color: #FFFFFF; font-size: 16px; font-weight: 600; letter-spacing: -0.01em; cursor: pointer; box-shadow: 0 12px 32px rgba(75,91,255,0.38);">Продолжить</button>
  </div>

</div>
</body>
</html>
